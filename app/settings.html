<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instellingen</title>
<style>
:root {
  --window: #f5f6f7; --bar: #eceef1; --surface: #ffffff; --line: #d9dde2; --line-soft: #e8ebee;
  --text: #1c1f23; --muted: #5b636d; --accent: #1a6fe0; --accent-text: #0f5bc4; --bad: #b3321f; --switch-off: #c4c9cf;
}
@media (prefers-color-scheme: dark) {
  :root {
    --window: #1d2025; --bar: #23272d; --surface: #262a30; --line: #343941; --line-soft: #30353c;
    --text: #e8eaed; --muted: #9aa2ad; --accent: #4c9dff; --accent-text: #7ab6ff; --bad: #ef7a66; --switch-off: #4a505a;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; display: flex; flex-direction: column;
  background: var(--window); color: var(--text);
  font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  font-variant-numeric: tabular-nums; -webkit-user-select: none; user-select: none; cursor: default;
}
nav { display: flex; justify-content: center; gap: 4px; padding: 6px 0 10px; background: var(--bar); border-bottom: 1px solid var(--line); }
nav button {
  all: unset; width: 86px; height: 50px; border-radius: 7px; font-size: 11px; color: var(--text);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
}
nav button[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent-text); }
nav svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { flex: 1; overflow-y: auto; padding: 20px 26px 28px; }
.empty { color: var(--muted); text-align: center; padding: 40px 0; }
[hidden] { display: none !important; }

.gh { font-weight: 650; margin: 0 0 6px 2px; }
.gsub { color: var(--muted); font-size: 12px; margin: -2px 0 8px 2px; }
.grp { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 18px; }
.row { display: flex; align-items: center; gap: 16px; padding: 9px 14px; border-top: 1px solid var(--line-soft); }
.grp > .row:first-child { border-top: 0; }
.lbl { flex: 1; min-width: 0; }
.help { color: var(--muted); font-size: 12px; margin-top: 2px; }
.err { color: var(--bad); font-size: 12px; margin-top: 3px; }
.ctl { display: flex; align-items: center; gap: 8px; flex: none; }
.state { color: var(--muted); font-size: 12px; }
code { font: 12px ui-monospace, Menlo, monospace; -webkit-user-select: text; user-select: text; }
input[type=text], input[type=number], select {
  font: inherit; padding: 4px 7px; border: 1px solid var(--line); border-radius: 5px; background: var(--window); color: var(--text);
}
input[type=text] { width: 230px; } input[type=number] { width: 72px; text-align: right; } select { min-width: 170px; }
input.switch { appearance: none; -webkit-appearance: none; margin: 0; width: 32px; height: 19px; border-radius: 10px; background: var(--switch-off); position: relative; flex: none; }
input.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: left .15s; }
input.switch:checked { background: var(--accent); } input.switch:checked::after { left: 15px; }
button.btn { font: inherit; padding: 3px 11px; border-radius: 5px; border: 1px solid var(--line); background: var(--surface); color: var(--text); }
button.btn:disabled { opacity: .5; }
button.btn.danger { color: var(--bad); }
button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.go { font: inherit; padding: 4px 14px; border-radius: 6px; border: 0; background: var(--accent); color: #fff; }
button.fold { all: unset; display: flex; align-items: center; gap: 6px; font-weight: 650; margin: 0 0 6px 2px; }
button.fold span { color: var(--muted); width: 10px; display: inline-block; }

.back { position: fixed; inset: 0; background: rgba(0,0,0,.25); display: flex; align-items: flex-start; justify-content: center; padding-top: 40px; }
.sheet { width: 600px; max-height: calc(100% - 60px); display: flex; flex-direction: column; background: var(--window);
         border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 34px rgba(0,0,0,.3); padding: 18px 20px; }
.sheet h2 { font-size: 15px; margin: 0 0 4px; }
.sheet .grp { overflow-y: auto; margin: 12px 0 14px; }
.sheet .row { padding: 7px 12px; }
.sheet .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet .foot { display: flex; gap: 8px; align-items: center; }
.split { display: flex; gap: 16px; align-items: flex-start; }
.ilist { width: 190px; flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
.items { padding: 6px; min-height: 120px; }
.item { all: unset; box-sizing: border-box; width: 100%; display: flex; align-items: center; gap: 9px; padding: 7px 8px; border-radius: 6px; }
.item[aria-current="true"] { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.ico { width: 28px; height: 28px; border-radius: 7px; background: var(--text); color: var(--window); display: flex; align-items: center; justify-content: center; flex: none; }
.ico svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ico.big { width: 40px; height: 40px; border-radius: 9px; } .ico.big svg { width: 22px; height: 22px; }
.ico.logo { background: transparent; overflow: hidden; } .ico.logo img { width: 100%; height: 100%; display: block; }
.nm { flex: 1; min-width: 0; display: flex; flex-direction: column; font-weight: 550; } .nm small { font-weight: 400; color: var(--muted); font-size: 11px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #b9bfc7; flex: none; } .dot.on { background: #2e9a48; } .dot.off { background: #c9412b; }
.pm { display: flex; border-top: 1px solid var(--line); }
.pm .btn { border: 0; border-right: 1px solid var(--line); border-radius: 0; width: 30px; padding: 2px 0; background: transparent; }
.detail { flex: 1; min-width: 0; }
.ihead { display: flex; align-items: center; gap: 12px; margin: 2px 0 16px; } .iname { font-size: 16px; font-weight: 650; }
.ihead .state { display: flex; align-items: center; gap: 6px; }
.untested { color: var(--muted); font-size: 12px; padding: 8px 10px 10px; margin: 0; }
.sheet .check { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; }
.sheet .check input { margin-top: 3px; }
.sheet input[type=text] { width: 100%; }
.note { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 14px; margin: 0 0 16px; color: var(--muted); }
button.link { all: unset; color: var(--accent-text); cursor: pointer; }
.tag { font-size: 11px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
</style>
</head>

const $ = id => document.getElementById(id);
const esc = text => String(text ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const num = n => (lang === "nl" ? String(n).replace(".", ",") : String(n));
const size = b => b < 1e6 ? `${Math.max(1, Math.round(b / 1e3))} kB` : `${num((b / 1e6).toFixed(1))} MB`;   // originelen zijn vaak maar een paar kB

// --- één instelling als rij, naar het soort uit het schema ---
function control(s, value) {
  const id = "f-" + s.key.replace(/\./g, "-");
  if (s.kind === "bool")
    return `<input type="checkbox" class="switch" role="switch" id="${id}" data-key="${s.key}" ${value ? "checked" : ""} aria-label="${esc(s.label)}">`;
  if (s.kind === "choice" || (s.kind === "text" && s.options)) {
    const options = s.choices || s.options;
    const names = (s.options ? T.languages : T.choices[s.key]) || {};
    const opts = options.map(o => {
      const untested = s.tested && !s.tested.includes(o) ? ` (${T.untested})` : "";
      return `<option value="${esc(o)}" ${o === value ? "selected" : ""}>${esc((names[o] || o) + untested)}</option>`;
    }).join("");
    return `<select id="${id}" data-key="${s.key}" aria-label="${esc(s.label)}">${opts}</select>`;
  }
  if (s.kind === "number")
    return `<input type="number" id="${id}" data-key="${s.key}" value="${esc(value)}" step="any" ${s.minimum !== undefined ? `min="${s.minimum}"` : ""} aria-label="${esc(s.label)}">`;
  if (s.kind === "languages")
    return `<input type="text" id="${id}" data-key="${s.key}" data-kind="languages" value="${esc((value || []).join(", "))}" aria-label="${esc(s.label)}">`;
  return `<input type="text" id="${id}" data-key="${s.key}" value="${esc(value)}" ${s.max_length ? `maxlength="${s.max_length}"` : ""} aria-label="${esc(s.label)}">`;
}

function row(label, help, ctl, key) {
  const err = key && errors[key] ? `<div class="err">${esc(errors[key])}</div>` : "";
  return `<div class="row"><div class="lbl">${label}${help ? `<div class="help">${help}</div>` : ""}${err}</div><div class="ctl">${ctl}</div></div>`;
}
const settingRow = s => row(esc(s.label), esc(s.help), control(s, data.values[s.key]), s.key);
const group = (title, rows, sub) => (title ? `<div class="gh">${esc(title)}</div>` : "") + (sub ? `<div class="gsub">${esc(sub)}</div>` : "") + `<div class="grp">${rows.join("")}</div>`;
const spec = key => data.settings.find(s => s.key === key);

// --- de tabs ---
function drawGeneral() {
  const rows = data.settings.filter(s => !s.section).map(settingRow);
  const login = data.extra.login;
  if (login && login.available)

  return group("", rows);
}

function drawTranscription() {
  const x = data.extra, v = data.values;
  const custom = AUTO.some(k => data.custom.includes(k));
  const section = spec(AUTO[0]).section;
  const autoRows = [row(esc(custom ? T.ownLimits : T.recommended),
                        esc(T.limits(num(v[AUTO[0]]), num(v[AUTO[1]]), num(v[AUTO[2]]))),
                        `<span class="state">${esc(custom ? T.adjusted : T.inUse)}</span>` +
                        (custom ? `<button class="btn" id="backRecommended">${esc(T.backToRecommended)}</button>`
                                : (ui.adjust ? "" : `<button class="btn" id="adjust">${esc(T.adjust)}</button>`)))];
  if (custom || ui.adjust) AUTO.forEach(k => autoRows.push(settingRow(spec(k))));
  const mb = size(x.originals.bytes);
  const advanced = data.settings.filter(s => s.kind !== "mapping" && !s.section && s.key !== "transcription.language");
  return group(T.language, [settingRow(spec("transcription.language"))])
    + group(T.models, [
        row(esc(T.speech), "", `<code>${esc(x.model)}</code>`),
        row(esc(T.speakers), "", `<span class="state">${esc({lokaal: T.spLocal, huggingface: T.spHub, uit: T.spOff}[x.speakers])}</span>`),
        `<div class="row"><div class="help" style="margin:0">${esc(T.credit)} ${esc(T.version)} ${esc(x.version)}.</div></div>`])
    + group(section.title, autoRows, section.help)
    + group(T.refine, [row(esc(T.originals(x.originals.count, mb)), esc(T.originalsHelp),
        `<button class="btn" id="showList" ${x.originals.count ? "" : "disabled"}>${esc(T.showList)}</button>` +
        `<button class="btn" id="clearOriginals" ${x.originals.count ? "" : "disabled"}>${esc(ui.clearArmed ? T.clearSure : T.clear)}</button>`)], T.refineSub)
    + `<button class="fold" id="advanced" aria-expanded="${ui.advanced}"><span>${ui.advanced ? "▾" : "▸"}</span>${esc(T.advanced)}</button>`
    + (ui.advanced ? group("", advanced.filter(s => s.advanced).map(settingRow)) : "");
}

    if (v["files.subtitle_place"] === "folder")
      subs.push(row(esc(T.subtitleFolder), v["files.subtitle_folder"] ? `<code>${esc(v["files.subtitle_folder"])}</code>` : esc(T.noFolder),

function workerLine(w) {
  let t = `${T.workerAs}: ${w.machine || ""}`;
  if (w.last_poll) t += `, ${T.workerLast} ${w.last_poll}`;
  if (w.last_asset) t += `, ${T.workerAsset} ${w.last_asset}`;
  if (w.paused_until) t += `. ${T.workerPaused} ${w.paused_until}${w.pause_reason ? ": " + w.pause_reason : ""}`;
  if (w.error) t += `. ${T.workerProblem}: ${w.error}`;
  return t + ".";
}

function autoLine(w) {
  const a = w.auto;
  if (!a) return "";
  const v = a.values || {}, why = T.autoWhy[a.reason];
  const value = {memory: v.free_gb, cpu: v.cpu, gpu: v.gpu}[a.reason];
  const reason = typeof why === "function" ? why(value == null ? "?" : num(Number(value).toFixed(a.reason === "memory" ? 1 : 0))) : (why || a.reason || "");
  return (a.ready ? T.autoReady : `${T.autoWait}: ${reason}.`) + (w.awake ? " " + T.autoAwake : "");
}

// Het icoon van de Iconik-omgeving zelf (van haar eigen host), of de stekker als dat er niet is of niet laadt.

function drawIntegrations() {
  const x = data.extra, v = data.values, w = x.worker;
  const has = x.instances.some(i => i.type === "iconik") || x.account !== "geen";
  const DOT = {gebruiker: "on", token: "on", uitgelogd: "off", geen: ""}, dot = DOT[x.account];

    (rows.length ? rows.map(item).join("")
     : has || ui.adding ? `<button class="item" aria-current="true">${logo(x.icon)}<span class="nm">Iconik<small>${esc(T.short[x.account])}</small></span><i class="dot ${dot}"></i></button>`

  if (!has && !ui.adding) return `<div class="split">${list}<div class="detail"><p class="empty">${esc(T.addHint)}</p></div></div>`;

  const status = {gebruiker: T.accAs(x.user), token: T.accToken, uitgelogd: T.accOut, geen: T.accNone}[x.account];
  let html = `<div class="ihead">${logo(x.icon, true)}<div><div class="iname">${esc(x.name)}</div><div class="state"><i class="dot ${dot}"></i>${esc(status)}</div></div></div>`;

  }
  if (x.same_as) html += `<div class="note" id="sameEnv">${esc(T.sameEnv(x.same_as_name))}</div>`;
  const nameSpec = spec("iconik.name");
  const account = [row(esc(nameSpec.label), esc(nameSpec.help), control(nameSpec, v["iconik.name"]).replace("<input ", `<input placeholder="${esc(x.auto_name)}" `), "iconik.name"),
                   settingRow(spec("iconik.host")), settingRow(spec("iconik.client_id"))];
  if (x.account === "gebruiker") account.push(row(esc(T.accAs(x.user)), "", `<button class="btn" id="logout">${esc(T.logout)}</button>`));
  else if (x.account !== "token")
    account.push(row(esc(x.has_client_id ? T.accOut : T.accNeedId), ui.loginFailed ? `<span class="err">${esc(T.loginFailed)}</span>` : "",
                     `<button class="go" id="login" ${x.has_client_id ? "" : "disabled"}>${esc(T.iconikLogin)}</button>`));
  html += group(T.account, account);
  const online = x.account === "gebruiker" || x.account === "token";
  if (online && !x.same_as) {   // de knoppen en de labels gelden voor de hele omgeving: via de eerste koppeling
    const text = {aanwezig: T.btnPresent, ontbreekt: T.btnMissing, geweigerd: T.btnDenied}[x.actions] || T.btnChecking;
    html += group(T.buttons, [row(esc(text), "", x.actions === "ontbreekt" ? `<button class="btn" id="installActions">${esc(T.btnInstall)}</button>` : "")]);
  }
  html += group(T.storage, x.mounts.length
    ? x.mounts.map(m => row(`${esc(m.name || "ISG " + m.id)}<div class="help"><code>${esc(m.path)}</code></div>`, "",
        `<button class="btn" data-mount="change" data-id="${esc(m.id)}">${esc(T.change)}</button><button class="btn" data-mount="remove" data-id="${esc(m.id)}">${esc(T.removeMount)}</button>`))
    : [row(`<span class="state">${esc(T.noMounts)}</span>`, "", "")], T.storageSub);
  // label: een eigen tekst waar de kop van het blok al zegt wat het schema-label zegt
  const withHelp = (key, help, extra, label) => row(esc(label || spec(key).label), esc(help) + (extra || ""), control(spec(key), v[key]), key);
  const remote = [withHelp("iconik.worker_enabled", T.workerHelp, "", T.workerOn)];
  if (w.enabled) {

    remote.push(`<div class="row"><div class="lbl help" style="margin:0">${esc(workerLine(w))}</div>${w.paused_until ? `<button class="btn" id="resumeNow">${esc(T.resumeNow)}</button>` : ""}</div>`);

    if (v["iconik.auto_transcribe"]) {
      auto.push(withHelp("iconik.auto_audio", T.autoAudioHelp));

  if (online && !x.same_as) html += group(T.labels, [row(esc(spec("iconik.iconik_language").label), esc(T.fieldsHelp) + (ui.fieldsMsg ? `<div class="state">${esc(ui.fieldsMsg)}</div>` : ""),
                                           control(spec("iconik.iconik_language"), v["iconik.iconik_language"]), "iconik.iconik_language")]);
  return `<div class="split">${list}<div class="detail">${html}</div></div>`;
}

function confirmRemove() {
  const item = data.extra.instances.find(i => i.id === ui.instance) || data.extra.instances.find(i => i.type === "iconik");
  if (!item) return;
  const sheet = $("sheet");
  const buttons = data.extra.buttons_removable && item.id === data.extra.instance;
  sheet.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(T.removeTitle(item.name))}"><h2>${esc(T.removeTitle(item.name))}</h2>
    <div class="help">${esc(T.removeHelp)}</div>
    <label class="check"><input type="checkbox" id="removeForget"><span>${esc(T.removeForget(item.name))}<div class="help">${esc(T.removeForgetHelp)}</div></span></label>
    ${buttons ? `<label class="check"><input type="checkbox" id="removeButtons"><span>${esc(T.removeButtons)}<div class="help">${esc(T.removeButtonsHelp)}</div></span></label>` : ""}
    <div class="err" id="removeErr"></div>
    <div class="foot" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="removeCancel">${esc(T.cancel)}</button>
    <button class="btn danger" id="removeConfirm">${esc(T.removeConfirm)}</button></div></div>`;
  sheet.hidden = false;
  $("removeCancel").focus();
  $("removeCancel").onclick = closeSheet;
  $("removeConfirm").onclick = async () => {
    const flags = ($("removeForget").checked ? "&forget=1" : "") + ($("removeButtons") && $("removeButtons").checked ? "&buttons=1" : "");
    const r = await fetch("/integrations/remove?id=" + encodeURIComponent(item.id) + flags, {method: "POST", headers: HDR}).then(r => r.json()).catch(() => ({ok: false}));
    if (!r.ok) { $("removeErr").textContent = r.error || T.failed; return; }
    ui.adding = false; ui.instance = "";
    if (!r.note) { closeSheet(); return; }
    // De koppeling is weg, maar de knoppen konden niet uit Iconik: dat zeggen, met OK.
    sheet.querySelector(".sheet").innerHTML = `<h2>${esc(T.removeTitle(item.name))}</h2><div class="help" id="removeNote">${esc(r.note)}</div>
      <div class="foot" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="removeOk">${esc(T.ok)}</button></div>`;
    $("removeOk").focus();
    $("removeOk").onclick = closeSheet;
  };
}

// +: een Iconik toevoegen, met een naam (een volgende heet standaard Iconik (2)) en, vanaf de tweede, de melding dat
// meerdere omgevingen nog niet echt getest zijn (besloten 25 november).
function confirmAdd() {
  const count = data.extra.instances.filter(i => i.type === "iconik").length;
  const sheet = $("sheet");
  sheet.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(T.addTitle)}"><h2>${esc(T.addTitle)}</h2>
    <div class="help" style="margin:8px 0 6px">${esc(T.addName)}</div>
    <input type="text" id="addName" maxlength="40" value="${esc(count ? `Iconik (${count + 1})` : "Iconik")}" aria-label="${esc(T.addName)}">
    ${count ? `<div class="note" id="addUntested" style="margin:12px 0 0">${esc(T.multiUntested)}</div>` : ""}
    <div class="err" id="addErr"></div>
    <div class="foot" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="addCancel">${esc(T.cancel)}</button>
    <button class="btn primary" id="addConfirm">${esc(T.addConfirm)}</button></div></div>`;
  sheet.hidden = false;
  $("addName").select();
  $("addCancel").onclick = closeSheet;
  const go = async () => {
    const r = await fetch("/integrations/add?name=" + encodeURIComponent($("addName").value.trim()), {method: "POST", headers: HDR}).then(r => r.json()).catch(() => ({ok: false}));
    if (!r.ok) { $("addErr").textContent = r.error || T.failed; return; }
    ui.instance = r.id; ui.adding = false; errors = {}; ui.loginFailed = false; ui.double = null;
    closeSheet();
  };
  $("addConfirm").onclick = go;
  $("addName").onkeydown = e => { if (e.key === "Enter") go(); if (e.key === "Escape") closeSheet(); };
}

const DRAW = {general: drawGeneral, transcription: drawTranscription, files: drawFiles, integrations: drawIntegrations};

function draw() {
  const panel = document.querySelector(`[data-panel="${current}"]`);
  if (!DRAW[current] || !data.settings) return;
  const focused = document.activeElement && document.activeElement.id;
  panel.innerHTML = DRAW[current]();
  if (focused && $(focused)) $(focused).focus();
}

async function load(tab) {
  if (!DRAW[tab]) return;
  const r = await fetch("/settings-data?group=" + GROUP[tab] + (tab === "integrations" ? inst() : ""));
  if (!r.ok) return;
  if (tab !== current) return;
  data = await r.json();
  if (tab === "integrations") ui.instance = data.extra.instance || "";   // zonder keuze: de eerste Iconik
  draw();
}

// --- bewaren: meteen, tekstvelden bij Enter of het verlaten van het veld ---
async function save(key, value) {
  const result = await post("/settings" + (key.startsWith("iconik.") ? inst("?") : ""), {[key]: value}).catch(() => ({ok: false, errors: {[key]: T.failed}}));
  if (result.ok) {
    delete errors[key];
    if (key === "general.app_language") { location.reload(); return; }   // de pagina komt terug in de nieuwe taal
    if (key === "iconik.iconik_language") ui.fieldsMsg = T.fieldsDone;
  } else {
    errors[key] = (result.errors && result.errors[key]) || result.error || T.failed;
  }
  await load(current);
}

function valueOf(el) {
  if (el.type === "checkbox") return el.checked;
  if (el.type === "number") return el.value === "" ? null : Number(el.value);
  if (el.dataset.kind === "languages") return el.value.split(/[\s,]+/).filter(Boolean).map(s => s.toLowerCase());
  return el.value;
}

document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "loginOn") { fetch("/login-item?value=" + (el.checked ? "on" : "off"), {method: "POST", headers: HDR}).then(() => load(current)); return; }
  if (el.dataset && el.dataset.sub) {
    fetch(`/folders/watch?path=${encodeURIComponent(el.dataset.sub)}&on=1&subfolders=${el.checked ? 1 : 0}`, {method: "POST", headers: HDR}).then(() => load(current));
    return;
  }
  // In één map…: eerst de map kiezen; zonder keuze blijft het Naast de media.
  if (el.dataset && el.dataset.key === "files.transcript_place" && el.value === "folder") {
    fetch("/files/folder", {method: "POST", headers: HDR}).then(() => load(current));
    return;
  }
  if (el.dataset && el.dataset.key === "files.subtitle_place" && el.value === "folder") {
    fetch("/files/folder?for=subtitles", {method: "POST", headers: HDR}).then(() => load(current));
    return;
  }
  if (el.dataset && el.dataset.key) save(el.dataset.key, valueOf(el));
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.dataset && e.target.dataset.key && e.target.tagName === "INPUT") e.target.blur();
});

document.addEventListener("click", async e => {
  const id = e.target.closest("button") && e.target.closest("button").id;
  if (ui.clearArmed && id !== "clearOriginals") { ui.clearArmed = false; draw(); }   // Leegmaken vraagt twee klikken achter elkaar
  if (id === "adjust") { ui.adjust = true; draw(); }
  else if (id === "backRecommended") { ui.adjust = false; await post("/settings/reset", {keys: AUTO}); AUTO.forEach(k => delete errors[k]); load(current); }
  else if (id === "advanced") { ui.advanced = !ui.advanced; draw(); }
  else if (id === "showList") openSheet();
  else if (id === "login") location.href = "/login?back=settings" + inst();
  else if (id === "logout") { await fetch("/logout" + inst("?"), {method: "POST", headers: HDR}); load(current); }
  else if (id === "installActions") { e.target.closest("button").disabled = true; await fetch("/actions/install" + inst("?"), {method: "POST", headers: HDR}); load(current); }
  else if (id === "resumeNow") { await fetch("/worker?value=resume" + inst(), {method: "POST", headers: HDR}); load(current); }
  else if (e.target.closest("[data-instance]")) {
    const pick = e.target.closest("[data-instance]").dataset.instance;
    if (pick !== ui.instance) { ui.instance = pick; ui.fieldsMsg = ""; errors = {}; ui.loginFailed = false; ui.double = null; load(current); }
  }
  else if (id === "addIntegration") confirmAdd();
  else if (id === "removeIntegration") confirmRemove();
  else if (id === "toLimits") show("transcription");
  else if (id === "chooseTranscriptFolder") { await fetch("/files/folder", {method: "POST", headers: HDR}); load(current); }
  else if (id === "chooseSubtitleFolder") { await fetch("/files/folder?for=subtitles", {method: "POST", headers: HDR}); load(current); }
  else if (id === "addFolder") { await fetch("/folders/choose", {method: "POST", headers: HDR}); load(current); }
  else if (id === "removeFolder" && ui.folder) {
    await fetch(`/folders/watch?path=${encodeURIComponent(ui.folder)}&on=0`, {method: "POST", headers: HDR});
    ui.folder = ""; load(current);
  }
  else if (e.target.closest("[data-forget]")) {
    await fetch("/local/place/forget?scope=" + encodeURIComponent(e.target.closest("[data-forget]").dataset.forget), {method: "POST", headers: HDR});
    load(current);
  }
  else if (e.target.closest("[data-pick]") && !e.target.closest("input")) { ui.folder = e.target.closest("[data-pick]").dataset.pick; draw(); }
  else if (e.target.closest("[data-mount]")) {
    const b = e.target.closest("[data-mount]");
    await fetch(`/mount/${b.dataset.mount}?id=${encodeURIComponent(b.dataset.id)}${inst()}`, {method: "POST", headers: HDR});
    load(current);
  }
  else if (id === "clearOriginals") {
    if (!ui.clearArmed) { ui.clearArmed = true; draw(); return; }
    ui.clearArmed = false;
    await fetch("/refine/originals/clear", {method: "POST", headers: HDR});
    load(current);
  }
});

// --- de lijst met originelen ---
async function openSheet() {
  const list = await fetch("/refine/originals").then(r => r.json()).then(x => Array.isArray(x) ? x : []).catch(() => []);
  const sheet = $("sheet");
  const rows = list.map(o => `<div class="row"><input type="checkbox" data-item="${esc(o.item)}" aria-label="${esc(o.title || o.item)}">
      <div class="title">${esc(o.title || o.item)}</div>${o.connector ? `<span class="tag">${esc(o.connector === "iconik" ? "Iconik" : o.connector)}</span>` : ""}
      <span class="state" style="width:84px">${esc(new Date(o.time * 1000).toLocaleDateString(lang, {day: "numeric", month: "short"}))}</span>
      <span class="state" style="width:56px;text-align:right">${esc(size(o.bytes))}</span></div>`).join("");
  sheet.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(T.sheetTitle)}">
      <h2>${esc(T.sheetTitle)}</h2><div class="help">${esc(T.sheetHelp)}</div>
      <div class="grp">${rows || `<div class="row state">${esc(T.noneLeft)}</div>`}</div>
      <div class="foot"><span class="state" id="count" style="flex:1">${esc(T.selected(0))}</span>
      <button class="btn danger" id="removeSelected" disabled>${esc(T.removeSelected)}</button><button class="go" id="sheetDone">${esc(T.done)}</button></div></div>`;
  sheet.hidden = false;
  $("sheetDone").focus();
  const picked = () => [...sheet.querySelectorAll("input[data-item]:checked")].map(i => i.dataset.item);
  sheet.onchange = () => { $("count").textContent = T.selected(picked().length); $("removeSelected").disabled = !picked().length; };
  $("removeSelected").onclick = async () => {
    for (const item of picked())
      await fetch("/refine/originals/remove?item=" + encodeURIComponent(item), {method: "POST", headers: HDR});
    openSheet();
    load(current);
  };
  $("sheetDone").onclick = closeSheet;
}
function closeSheet() { $("sheet").hidden = true; $("sheet").innerHTML = ""; load(current); }
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheet").hidden) closeSheet(); });

// --- tabs ---
function show(tab) {
  if (!TABS.includes(tab)) tab = "general";
  current = tab;
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  document.querySelectorAll("[data-panel]").forEach(p => p.hidden = p.dataset.panel !== tab);
  document.title = T[tab];
  remember(tab);
  // pywebview neemt de <title> niet over; de app zet de titel van het venster zelf.
  post("/window/title", {title: T[tab]}).catch(() => {});
  load(tab);
}

document.documentElement.lang = lang;
document.querySelectorAll("[data-t]").forEach(el => el.textContent = T[el.dataset.t]);
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => show(b.dataset.tab)));
// Iemand typt of kiest: dan niet opnieuw tekenen. Een schakelaar met focus telt niet, anders ververst de tab
// na het omzetten niet meer tot er ergens anders geklikt wordt.
const editing = () => document.activeElement.matches('input[type="text"], input[type="number"], select');
setInterval(() => {
  if (current === "integrations" && $("sheet").hidden && !editing()) load(current);
}, 3000);
window.addEventListener("focus", () => { if ($("sheet").hidden && !editing()) load(current); });   // het hoofdvenster kan intussen iets veranderd hebben
show(new URLSearchParams(location.search).get("tab") || remembered());
// ?tab= geldt alleen bij het openen; daarna uit het adres, zodat opnieuw laden (taalwissel) op de huidige tab blijft.
if (location.search) history.replaceState(null, "", location.pathname);
</script>
