<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Transcribe</title>
<style>
:root {
  --window: #f5f6f7; --side: #e9ebee; --surface: #ffffff; --line: #d9dde2;
  --text: #1c1f23; --muted: #6a727d; --accent: #1a6fe0;
  --good: #2e9a48; --warn: #b07a10; --bad: #c9412b; --idle: #b9bfc7;
}
@media (prefers-color-scheme: dark) {
  :root {
    --window: #1d2025; --side: #171a1e; --surface: #262a30; --line: #343941;
    --text: #e8eaed; --muted: #8d95a0; --accent: #4c9dff;
    --good: #62c370; --warn: #e0a83a; --bad: #e5634d; --idle: #4a505a;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; display: flex; flex-direction: column;
  background: var(--window); color: var(--text);
  font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  font-variant-numeric: tabular-nums; -webkit-user-select: none; user-select: none; cursor: default;
}
.bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px 10px 22px; background: var(--side); border-bottom: 1px solid var(--line); }
.bar h1 { font-size: 14px; font-weight: 650; margin: 0; flex: 1; letter-spacing: -.01em; }
.bar button { all: unset; display: flex; align-items: center; gap: 7px; padding: 4px 7px; border-radius: 6px; color: var(--muted); }
.bar button:hover { background: color-mix(in srgb, var(--line) 60%, transparent); }
.bar svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); flex: none; }
.dot.on { background: var(--good); } .dot.off { background: var(--bad); } .dot.wait { background: var(--warn); }
main { flex: 1; overflow-y: auto; padding: 18px 22px 28px; }
header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; }
header h2 { font-size: 20px; font-weight: 650; margin: 0; letter-spacing: -.015em; flex: 1; }
button.plain, a.plain { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; text-decoration: none; cursor: pointer; }
button.plain:disabled { color: var(--idle); cursor: default; }
.note { background: color-mix(in srgb, var(--warn) 16%, transparent); border-left: 3px solid var(--warn);
        padding: 8px 10px; border-radius: 4px; margin-bottom: 12px; -webkit-user-select: text; user-select: text; }

.summary { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1.4fr; gap: 18px; padding: 12px 14px;
           background: var(--surface); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 16px; }
.summary dt { color: var(--muted); } .summary dd { margin: 0; font-size: 18px; font-weight: 600; }
.summary dl { margin: 0; min-width: 0; }
.total { height: 5px; border-radius: 3px; background: var(--line); margin-top: 7px; overflow: hidden; }
.total i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
.rate { display: flex; align-items: flex-end; gap: 10px; }
.speeds { display: flex; align-items: flex-end; gap: 2px; height: 24px; flex: 1; margin-bottom: 3px; }
.mount { display: flex; align-items: center; gap: 14px; padding: 4px 0; } .mount div { flex: 1; min-width: 0; }
.speeds i { flex: 1; max-width: 9px; background: var(--accent); border-radius: 1px 1px 0 0; min-height: 2px; }

.job { border-bottom: 1px solid var(--line); padding: 10px 8px 11px; border-radius: 6px; }
.job.sel { background: color-mix(in srgb, var(--accent) 12%, transparent); }
button.x { font: inherit; background: none; border: 0; color: var(--muted); padding: 0 4px; cursor: pointer; }
.menu { position: fixed; z-index: 10; min-width: 250px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
        padding: 5px 0; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
.menu button { all: unset; box-sizing: border-box; display: flex; width: calc(100% - 10px); margin: 0 5px; padding: 3px 10px; border-radius: 4px; }
.menu button span { flex: 1; } .menu button kbd { font: inherit; color: var(--muted); }
.menu button:hover:not(:disabled), .menu button:focus-visible { background: var(--accent); color: #fff; outline: none; }
.menu button:hover:not(:disabled) kbd { color: #fff; }
.menu button:disabled { color: var(--idle); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 10px; }
.back { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.25); display: flex; align-items: flex-start; justify-content: center; padding-top: 60px; }
.sheet { width: 480px; background: var(--window); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 34px rgba(0,0,0,.3); padding: 20px 22px; }
.sheet h2 { font-size: 15px; margin: 0 0 6px; overflow-wrap: anywhere; }
.sheet .keep { margin: 12px 0 4px; padding: 9px 11px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.sheet .foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.sheet .btn { font: inherit; padding: 4px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--text); }
.sheet .go.danger { background: var(--bad); }
.top { display: flex; gap: 10px; align-items: baseline; }
.title[data-asset] { cursor: pointer; } .title[data-asset]:hover { color: var(--accent); }
.title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 550;
         -webkit-user-select: text; user-select: text; }
.state { color: var(--muted); white-space: nowrap; }
section.set p.autostate { margin-bottom: 1.4em; }   /* zo specifiek als section.set p, anders wint die */
.tag.draft { color: var(--accent); border-color: var(--accent); }
button.tag.jump { font-family: inherit; background: none; color: var(--accent); border-color: var(--accent); cursor: pointer; }
button.tag.jump:hover { background: var(--accent); color: #fff; }
.tag { font-size: 11px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; white-space: nowrap; }
.state.bezig { color: var(--accent); } .state.klaar { color: var(--good); } .state.fout { color: var(--bad); } .state.afgebroken { color: var(--muted); } .state.teruggezet { color: var(--warn); }
.msg { color: var(--muted); margin-top: 2px; -webkit-user-select: text; user-select: text; }
.msg.fout { color: var(--bad); }
.stages { display: grid; grid-template-columns: 1fr 4fr 2fr 1fr; gap: 3px; margin-top: 8px; }
.stage b { display: block; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.stage b i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s; }
.stage.done b i { width: 100%; }
.stage.wait b i { width: 40%; animation: slide 1.4s ease-in-out infinite alternate; }
.stage span { display: block; margin-top: 3px; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stage.now span { color: var(--text); }
@keyframes slide { from { margin-left: 0; } to { margin-left: 60%; } }
@media (prefers-reduced-motion: reduce) { .stage.wait b i { animation: none; width: 100%; opacity: .45; } .total i, .stage b i { transition: none; } }
.tracks { margin-top: 9px; display: grid; grid-template-columns: auto 1fr auto; gap: 3px 10px; align-items: center; }
.tracks .nr { color: var(--muted); font-size: 11px; }
.tracks svg { width: 100%; height: 22px; display: block; background: color-mix(in srgb, var(--line) 45%, transparent); border-radius: 3px; }
.tracks .used { fill: var(--good); } .tracks .skip { fill: var(--idle); } .tracks .code { fill: var(--warn); }
.tracks .what { font-size: 11px; color: var(--muted); white-space: nowrap; }
.tracks .what.on { color: var(--text); }
.more { font-size: 11px; margin-left: 2px; }
.empty { color: var(--muted); padding: 60px 0 36px; text-align: center; max-width: 48ch; margin: 0 auto; }
.empty svg { width: 40px; height: 40px; fill: none; stroke: var(--idle); stroke-width: 1.5; stroke-linecap: round; }
.empty .et { font-size: 15px; font-weight: 600; color: var(--text); margin: 8px 0 4px; }
.strip { display: flex; gap: 18px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 12px; }
.strip > div { flex: 1; min-width: 0; } .strip dt { color: var(--muted); font-size: 12px; } .strip dd { margin: 0; display: flex; align-items: center; gap: 6px; }

button.go { font: inherit; padding: 4px 10px; border-radius: 5px; border: 0; background: var(--accent); color: #fff; margin-left: 6px; }
[hidden] { display: none !important; }
</style>
</head>

    audioLength: "Audio length", result: (l, s) => `${l} ${l === 1 ? "line" : "lines"}, ${s} ${s === 1 ? "speaker" : "speakers"}`,
    doneIn: (t, x) => `done in ${t} (${x}x realtime)`, hide: "Hide tracks", tracks: n => `${n} ${n === 1 ? "track" : "tracks"}`,
    ignored: "ignored", done: "Finished", of: "of", audioDone: "Audio transcribed", skipped: "Skipped or failed",
    speed: "Speed, times realtime", average: x => `average ${x}x realtime`, times: "x realtime",
    empty: "Pick an asset or collection in Iconik and choose Local Transcribe. Jobs appear here.",
    clientId: "Client ID of the application your Iconik admin created:", save: "Save and log in",
    accNone: "Not connected to Iconik yet.", accOut: "Not logged in.", otherId: "Use another Client ID", login: "Log in to Iconik", accUser: "Connected to Iconik.", accAs: "Logged in as",
    logout: "Log out", accToken: "Connected with a personal token from", loginOwn: "Log in with your own account",
    noMounts: "No mount point yet. The app asks for the folder on the first job from an ISG.",
    speech: "Speech", speakers: "Speakers", spLocal: "pyannote community-1, bundled with the app", spHub: "pyannote community-1, via Hugging Face",
    spOff: "no model found, speaker detection is off",
    credit: "Speaker detection uses pyannote speaker-diarization-community-1 by pyannoteAI, licensed CC-BY-4.0. Speech recognition uses Whisper large-v3 by OpenAI via MLX.",
    who: {geen: "Not connected", uitgelogd: "Not logged in", gebruiker: "Logged in to Iconik", token: "Personal token"}, down: "Receiver is not responding",
    refinedTag: "Refined", draftTag: "Draft", subtitlesTag: "Subtitles", subtitlesOpen: "Open the subtitles in Refine",
    originals: (n, mb) => n ? `Originals of ${n} corrected ${n === 1 ? "transcript are" : "transcripts are"} kept on this Mac (${mb} MB). With them you can put an original back in Iconik from Refine.` : "No originals of corrected transcripts on this Mac.",
    clearOriginals: "Clear", clearSure: "Sure? No original can be put back afterwards. Click again",
    notes: {"geluid": "audio", "stil": "silent", "tijdcode of toon": "timecode or tone", "eigen microfoon": "dedicated microphone", "gekozen spoor": "chosen track"},
  },
};
const STAGE_KEYS = ["audio", "transcriberen", "sprekers", "schrijven"];
const open = {};
let drawn = {}, lang = "en", T = TEXT.en, started = false;

const $ = id => document.getElementById(id);
// Verzoeken die iets veranderen gaan met deze header; de ontvanger weigert ze zonder (zie PROTECTED in serve.py).
const H = { method: "POST", headers: { "X-Local-Transcribe": "1" } };   // alles wat iets verandert is een POST
const act = path => fetch(path, H);
const esc = text => String(text ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const clock = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s % 60).padStart(2, "0"); };
const num = (n, d = 1) => lang === "nl" ? n.toFixed(d).replace(".", ",") : n.toFixed(d);

function setLanguage(choice) {
  lang = choice === "nl" ? "nl" : "en";
  T = TEXT[lang]; drawn = {}; $("list").innerHTML = "";
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = T[el.dataset.t]);
}
function note(text) {
  if (lang === "nl") return text;
  const same = /^zelfde signaal als spoor (\d+)$/.exec(text);
  return same ? `same signal as track ${same[1]}` : T.notes[text] || text;
}

if (NOTE) { $("note").textContent = NOTE; $("note").hidden = false; }
$("clear").onclick = () => act("/clear").then(tick);
let jobsByN = {};
function select(n) { selected = n; drawn = Object.fromEntries(Object.entries(drawn).filter(([k]) => !k.startsWith("job-"))); tick(); }
async function removeJob(n, everything) {
  const r = await fetch(`/jobs/remove?n=${n}${everything ? "&all=1" : ""}`, H).then(r => r.json()).catch(() => ({ok: false}));
  if (!r.ok && r.error) { $("note").textContent = r.error; $("note").hidden = false; }
  if (r.ok) selected = null;
  tick();
}
function closeMenu() { $("menu").hidden = true; $("menu").innerHTML = ""; }
function openMenu(job, x, y) {
  const can = removable(job), ref = job.item, asset = job.asset_id;
  const item = (id, label, on, key = "", tip = "") => `<button role="menuitem" data-act="${id}"${on ? "" : " disabled"}${tip ? ` title="${esc(tip)}"` : ""}><span>${esc(label)}</span><kbd>${key}</kbd></button>`;
  $("menu").innerHTML = item("refine", T.openRefine, job.status === "klaar" && !!ref) + item("iconik", T.openIconik, !!asset)
    + "<hr>" + item("remove", T.removeRow, can, "⌫") + item("all", T.removeAll, can && !!ref, "", T.removeAllTip);
  const m = $("menu");
  m.hidden = false;
  m.style.left = Math.min(x, innerWidth - m.offsetWidth - 8) + "px";
  m.style.top = Math.min(y, innerHeight - m.offsetHeight - 8) + "px";
  m.onclick = e => {
    const b = e.target.closest("button[data-act]"); if (!b || b.disabled) return;
    closeMenu();
    if (b.dataset.act === "refine") location.href = "/refine?item=" + encodeURIComponent(ref);
    else if (b.dataset.act === "iconik") act("/asset/open?id=" + encodeURIComponent(asset));
    else if (b.dataset.act === "remove") removeJob(job.n, false);
    else confirmAll(job);
  };
}
function closeSheet() { $("sheet").hidden = true; $("sheet").innerHTML = ""; }
function confirmAll(job) {
  $("sheet").innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(T.removeTitle(job.title || job.asset_id))}">
    <h2>${esc(T.removeTitle(job.title || job.asset_id))}</h2><p class="msg">${esc(T.removeText)}</p>
    <div class="keep"><b>${esc(T.removeKeep)}</b></div>
    <p class="msg">${esc(T.removeLog)} <button class="plain" id="clearLog">${esc(T.clearLog)}</button></p>
    <div class="foot"><button class="btn" id="sheetCancel">${esc(T.cancel)}</button><button class="go danger" id="sheetRemove">${esc(T.remove)}</button></div></div>`;
  $("sheet").hidden = false;
  $("sheetCancel").focus();
  $("sheetCancel").onclick = closeSheet;
  $("clearLog").onclick = async e => { const r = await act("/log/clear").then(r => r.json()).catch(() => ({})); if (r.ok) e.target.replaceWith(T.logCleared); };
  $("sheetRemove").onclick = () => { closeSheet(); removeJob(job.n, true); };
}
document.addEventListener("click", e => { if (!e.target.closest("#menu")) closeMenu(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeMenu(); closeSheet(); return; }
  if (!$("sheet").hidden || e.target.matches("input, textarea, select")) return;
  if ((e.key === "Backspace" || e.key === "Delete") && selected != null && jobsByN[selected] && removable(jobsByN[selected])) {
    e.preventDefault(); removeJob(selected, false);
  }
});
$("list").addEventListener("contextmenu", e => {
  const el = e.target.closest(".job"); if (!el) return;
  e.preventDefault();
  const n = Number(el.id.slice(4));
  if (n !== selected) select(n);
  if (jobsByN[n]) openMenu(jobsByN[n], e.clientX, e.clientY);
});

$("list").onclick = e => {
  if (e.target.id === "connect") { act("/window/settings?tab=integrations"); return; }
  const x = e.target.closest("[data-remove]"); if (x) { removeJob(Number(x.dataset.remove), false); return; }
  const s = e.target.closest("[data-subtitles]"); if (s) { location.href = "/refine?item=" + encodeURIComponent(s.dataset.subtitles) + "&tab=subtitles"; return; }
  const r = e.target.closest("[data-refine]"); if (r) { location.href = "/refine?item=" + encodeURIComponent(r.dataset.refine); return; }
  const a = e.target.closest("[data-asset]"); if (a && !window.getSelection().toString()) { act("/asset/open?id=" + encodeURIComponent(a.dataset.asset)); return; }
  const b = e.target.closest("[data-toggle]"); if (b) { open[b.dataset.toggle] = b.dataset.open !== "1"; tick(); return; }
  const j = e.target.closest(".job"); if (j) select(Number(j.id.slice(4)) === selected ? null : Number(j.id.slice(4)));
};
// Instellingen: het tandwiel opent de laatste tab, de status en de knop in de lege lijst openen Integraties.
$("gear").onclick = () => act("/window/settings");
$("status").onclick = () => act("/window/settings?tab=integrations");
$("getUpdate").onclick = () => act("/update/install");
$("openUpdate").onclick = () => act("/update/open");
$("install").onclick = e => { e.target.disabled = true; act("/actions/install").then(tick).finally(() => e.target.disabled = false); };
function wave(track) {
  const env = track.env || [], n = env.length;
  if (n < 2) return "<svg></svg>";
  let up = "", down = "";
  env.forEach((v, i) => { up += `${i},${(10 - v * 9.5).toFixed(1)} `; down = `${i},${(10 + v * 9.5).toFixed(1)} ` + down; });
  const kind = track.used ? "used" : track.note.startsWith("tijdcode") ? "code" : "skip";
  return `<svg viewBox="0 0 ${n - 1} 20" preserveAspectRatio="none" aria-hidden="true"><polygon class="${kind}" points="${up}${down}"/></svg>`;
}

function stages(job) {
  if (job.stage === "model") {
    const wait = job.fraction == null;
    const bar = wait ? "<i></i>" : `<i style="width:${(job.fraction * 100).toFixed(1)}%"></i>`;
    const pct = wait ? "" : " " + Math.round(job.fraction * 100) + "%";
    return `<div class="stages" style="grid-template-columns:1fr"><div class="stage now${wait ? " wait" : ""}"><b>${bar}</b><span>${T.download}${pct}</span></div></div>`;
  }
  const at = STAGE_KEYS.indexOf(job.stage);
  return '<div class="stages">' + T.stages.map((label, i) => {
    if (i < at) return `<div class="stage done"><b><i></i></b><span>${label}</span></div>`;
    if (i > at) return `<div class="stage"><b><i></i></b><span>${label}</span></div>`;
    if (job.fraction == null) return `<div class="stage now wait"><b><i></i></b><span>${label}</span></div>`;
    return `<div class="stage now"><b><i style="width:${(job.fraction * 100).toFixed(1)}%"></i></b><span>${label} ${Math.round(job.fraction * 100)}%</span></div>`;
  }).join("") + "</div>";
}

let selected = null;   // het nummer van de geselecteerde regel
const removable = job => !["wachtend", "bezig"].includes(job.status);
function row(job, isOpen) {
  let state = T.status[job.status] || job.status, msg = job.message || "";
  if (job.status === "bezig") msg = job.duration ? T.audioLength + " " + clock(job.duration) : "";
  else if (job.status === "klaar") {
    if (job.result) msg = T.result(job.result.segments, job.result.speakers) + (job.language ? ", " + job.language.toUpperCase() : "");
    if (job.elapsed && job.duration) msg += ", " + T.doneIn(clock(job.elapsed), num(job.duration / job.elapsed));
  } else if (job.status === "wachtend") state += " " + job.added;
  const tracks = job.tracks || [];
  const toggle = tracks.length ? `<button class="plain more" data-toggle="${job.n}" data-open="${isOpen ? 1 : 0}">${isOpen ? T.hide : T.tracks(tracks.length)}</button>` : "";
  const refine = job.status === "klaar" ? `<button class="plain more" data-refine="${esc(job.item)}">Refine</button>` : "";
  const rf = job.refine || {};
  const marks = (rf.refined ? `<span class="tag">${T.refinedTag}</span>` : "") + (rf.draft ? `<span class="tag draft">${T.draftTag}</span>` : "")
    + (rf.subtitles ? `<button class="tag jump" data-subtitles="${esc(job.item)}" title="${T.subtitlesOpen}">${T.subtitlesTag}</button>` : "");
  let html = `<div class="top"><div class="title"${job.asset_id ? ` data-asset="${esc(job.asset_id)}" title="${T.openIconik}"` : ""}>${esc(job.title || job.asset_id)}</div>${job.auto ? `<span class="tag">${T.autoTag}</span>` : ""}${marks}${refine}${toggle}<div class="state ${job.status}">${esc(state)}<span class="el"></span></div>${job.n === selected && removable(job) ? `<button class="x" data-remove="${job.n}" aria-label="${T.removeRow}" title="${T.removeRow}">✕</button>` : ""}</div>`;
  if (msg) html += `<div class="msg ${job.status === "fout" ? "fout" : ""}">${esc(msg)}</div>`;
  if (job.status === "bezig") html += stages(job);
  if (isOpen && tracks.length) html += '<div class="tracks">' + tracks.map(t =>
    `<div class="nr">${t.n}</div>${wave(t)}<div class="what ${t.used ? "on" : ""}">${esc(note(t.note))}${t.used ? "" : ", " + T.ignored}, ${num(t.db)} dB</div>`).join("") + "</div>";
  return html;
}

function summary(all) {
  const jobs = all.filter(j => !["afgebroken", "teruggezet"].includes(j.status));   // telt niet mee in de cijfers
  const done = jobs.filter(j => !["wachtend", "bezig"].includes(j.status));
  const good = jobs.filter(j => j.status === "klaar" && j.elapsed && j.duration);
  const audio = good.reduce((a, j) => a + j.duration, 0), spent = good.reduce((a, j) => a + j.elapsed, 0);
  const share = jobs.length ? done.length / jobs.length : 0;
  const last = good.slice(0, 30).reverse(), top = Math.max(1, ...last.map(j => j.duration / j.elapsed));
  const other = jobs.filter(j => ["overgeslagen", "fout"].includes(j.status)).length;
  $("summary").innerHTML =
    `<dl><dt>${T.done}</dt><dd>${done.length} ${T.of} ${jobs.length}</dd><div class="total"><i style="width:${share * 100}%"></i></div></dl>` +
    `<dl><dt>${T.audioDone}</dt><dd>${clock(audio)}</dd></dl>` +
    `<dl><dt>${T.skipped}</dt><dd>${other}</dd></dl>` +
    `<dl><dt>${T.speed}</dt><div class="rate"><dd>${spent ? num(audio / spent) + "×" : "&nbsp;"}</dd>` +
    (last.length ? `<div class="speeds">${last.map(j => `<i title="${esc(j.title)}: ${num(j.duration / j.elapsed)} ${T.times}" style="height:${Math.max(6, j.duration / j.elapsed / top * 100)}%"></i>`).join("")}</div>` : "") + `</div></dl>`;
  $("clear").disabled = !all.some(j => !["wachtend", "bezig"].includes(j.status));
}

function autoReason(a) {
  const v = a.values || {}, why = T.autoWhy[a.reason];
  const value = { memory: v.free_gb, cpu: v.cpu, gpu: v.gpu }[a.reason];
  return typeof why === "function" ? why(value == null ? "?" : num(value, a.reason === "memory" ? 1 : 0)) : (why || a.reason || "");
}
// Wat er naast de lijst speelt: de verbinding rechtsboven, de balken bovenaan en de statusstrook.
function status(s) {
  const online = s.account === "gebruiker" || s.account === "token";
  $("status").hidden = s.account === "geen";
  $("status").title = T.toIntegrations;
  $("dot").className = "dot " + (online ? "on" : "off");
  $("who").textContent = T.who[s.account];
  $("button").hidden = !["ontbreekt", "geweigerd"].includes(s.actions);
  $("buttonText").textContent = s.actions === "geweigerd" ? T.btnDenied : T.btnMissing;
  $("install").textContent = T.btnInstall; $("install").hidden = s.actions === "geweigerd";
  const w = s.worker || {}, off = (w.enabled && w.auto_on && w.auto && w.auto.offline) || [];
  $("storageOff").hidden = !off.length;
  if (off.length) $("storageOff").textContent = T.storageOff(off.join(", "));
  $("update").hidden = !s.update;
  if (s.update) {
    const u = s.update;
    let text = T.updateAvail(u.version), install = false, download = false;
    if (u.state === "installing") text = T.updateBusy(u.version);
    else if (u.state === "ready") text = u.waiting ? T.updateWaiting(u.version) : T.updateReady(u.version);
    else if (u.state === "error") { text = T.updateFail(u.error); install = true; download = true; }
    else if (u.mode === "code") install = true;
    else { text += " " + T.updateFull; download = true; }
    $("updateText").textContent = text;
    $("getUpdate").hidden = !install; $("getUpdate").textContent = u.state === "error" ? T.updateRetry : T.updateInstall;
    $("openUpdate").hidden = !download; $("openUpdate").textContent = T.updateGet;
  }
  // De statusstrook: alleen wat aan staat. Instellen gebeurt in Instellingen.
  const cells = [];
  if (online) {
    const remote = !w.enabled ? ["", T.remoteOff] : w.paused_until ? ["wait", `${T.workerPaused} ${w.paused_until}`]
                 : w.error ? ["off", `${T.workerProblem}: ${w.error}`] : ["on", T.remoteOn];
    cells.push([T.stripRemote, ...remote]);
    if (w.enabled && w.auto_on && w.auto) cells.push([T.stripAuto, w.auto.ready ? "on" : "wait", w.auto.ready ? T.autoReady : `${T.autoWait}: ${autoReason(w.auto)}.`]);
    if ((s.mounts || []).length) {
      const names = s.mounts.map(m => m.name || "ISG " + m.id).join(", ");
      // Wat de app nu echt ziet, ook met automatisch transcriberen uit (dan zonder de zin over oppakken).
      const st = s.storage || {}, gone = st.offline || [];
      cells.push([T.stripStorage, ...(!st.checked ? ["wait", T.storageChecking]
        : off.length ? ["off", T.storageOff(off.join(", "))]
        : gone.length ? ["off", T.storageGone(gone.join(", "))] : ["on", `${names} ${T.storageOk}`])]);
    }
  }
  const html = cells.map(([label, dot, text]) => `<div><dt>${esc(label)}</dt><dd><i class="dot ${dot}"></i>${esc(text)}</dd></div>`).join("");
  $("strip").hidden = !html;
  if (drawn.strip !== html) { $("strip").innerHTML = html; drawn.strip = html; }
}
async function tick() {
  let s;
  try { s = await (await fetch("/state")).json(); } catch { $("who").textContent = T.down; $("dot").className = "dot off"; return; }
  if (s.lang !== lang || !started) { started = true; setLanguage(s.lang); }
  summary(s.jobs); status(s);
  $("summary").hidden = !s.jobs.length;
  const list = $("list"), seen = new Set();
  if (!s.jobs.length) {
    const connect = s.account === "geen" || s.account === "uitgelogd";
    const html = `<div class="empty"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h8M4 6h0M4 12h0M4 18h0"/></svg>`
      + `<p class="et">${T.emptyTitle}</p><p>${connect ? T.emptyConnect : T.empty}</p>`
      + (connect ? `<p><button class="go" id="connect">${T.connect}</button></p>` : "") + `</div>`;
    if (drawn.empty !== html) { list.innerHTML = html; drawn.empty = html; }
    return;
  }
  if (drawn.empty) { list.innerHTML = ""; drawn.empty = false; }
  $("connect") && $("connect").remove();
  jobsByN = {};
  s.jobs.forEach((job, index) => {
    const id = "job-" + job.n, isOpen = open[job.n] ?? job.status === "bezig";
    jobsByN[job.n] = job;
    seen.add(id);
    let el = $(id);
    if (!el) { el = document.createElement("div"); el.className = "job"; el.id = id; }
    if (list.children[index] !== el) list.insertBefore(el, list.children[index] || null);
    const html = row(job, isOpen);
    el.classList.toggle("sel", job.n === selected);
    if (drawn[id] !== html) { el.innerHTML = html; drawn[id] = html; }
    el.querySelector(".el").textContent = job.status === "bezig" ? " " + clock(job.elapsed || 0) : "";
  });
  [...list.children].forEach(el => { if (!seen.has(el.id)) { delete drawn[el.id]; el.remove(); } });
}
tick(); setInterval(tick, 1000);
</script>
</body>
</html>
