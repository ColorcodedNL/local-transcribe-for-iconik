<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Transcribe</title>
<style>
:root {
  --window: #f5f6f7; --side: #e9ebee; --surface: #ffffff; --line: #d9dde2;
  --text: #1c1f23; --muted: #6a727d; --accent: #1a6fe0;
  --good: #2e9a48; --warn: #b07a10; --bad: #c9412b; --idle: #b9bfc7;
}
@media (prefers-color-scheme: dark) {
  :root {
    --window: #1d2025; --side: #171a1e; --surface: #262a30; --line: #343941;
    --text: #e8eaed; --muted: #8d95a0; --accent: #4c9dff;
    --good: #62c370; --warn: #e0a83a; --bad: #e5634d; --idle: #4a505a;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; display: flex; flex-direction: column;
  background: var(--window); color: var(--text);
  font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  font-variant-numeric: tabular-nums; -webkit-user-select: none; user-select: none; cursor: default;
}
.bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px 10px 22px; background: var(--side); border-bottom: 1px solid var(--line); }
.bar h1 { font-size: 14px; font-weight: 650; margin: 0; flex: 1; letter-spacing: -.01em; }
.bar button { all: unset; display: flex; align-items: center; gap: 7px; padding: 4px 7px; border-radius: 6px; color: var(--muted); }
.bar button:hover { background: color-mix(in srgb, var(--line) 60%, transparent); }
.bar svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); flex: none; }
.dot.on { background: var(--good); } .dot.off { background: var(--bad); } .dot.wait { background: var(--warn); }
main { flex: 1; overflow-y: auto; padding: 18px 22px 28px; }
header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; }
header h2 { font-size: 20px; font-weight: 650; margin: 0; letter-spacing: -.015em; flex: 1; }
button.plain, a.plain { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; text-decoration: none; cursor: pointer; }
button.plain:disabled { color: var(--idle); cursor: default; }
.note { background: color-mix(in srgb, var(--warn) 16%, transparent); border-left: 3px solid var(--warn);
        padding: 8px 10px; border-radius: 4px; margin-bottom: 12px; -webkit-user-select: text; user-select: text; }

.summary { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1.4fr; gap: 18px; padding: 12px 14px;
           background: var(--surface); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 16px; }
.summary dt { color: var(--muted); } .summary dd { margin: 0; font-size: 18px; font-weight: 600; }
.summary dl { margin: 0; min-width: 0; }
.total { height: 5px; border-radius: 3px; background: var(--line); margin-top: 7px; overflow: hidden; }
.total i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
.rate { display: flex; align-items: flex-end; gap: 10px; }
.speeds { display: flex; align-items: flex-end; gap: 2px; height: 24px; flex: 1; margin-bottom: 3px; }
.mount { display: flex; align-items: center; gap: 14px; padding: 4px 0; } .mount div { flex: 1; min-width: 0; }
.speeds i { flex: 1; max-width: 9px; background: var(--accent); border-radius: 1px 1px 0 0; min-height: 2px; }

.job { border-bottom: 1px solid var(--line); padding: 10px 8px 11px; border-radius: 6px; }
.job.sel { background: color-mix(in srgb, var(--accent) 12%, transparent); }
button.x { font: inherit; background: none; border: 0; color: var(--muted); padding: 0 4px; cursor: pointer; }
.menu { position: fixed; z-index: 10; min-width: 250px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
        padding: 5px 0; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
.menu button { all: unset; box-sizing: border-box; display: flex; width: calc(100% - 10px); margin: 0 5px; padding: 3px 10px; border-radius: 4px; }
.menu button span { flex: 1; } .menu button kbd { font: inherit; color: var(--muted); }
.menu button:hover:not(:disabled), .menu button:focus-visible { background: var(--accent); color: #fff; outline: none; }
.menu button:hover:not(:disabled) kbd { color: #fff; }
.menu button:disabled { color: var(--idle); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 10px; }
.back { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.25); display: flex; align-items: flex-start; justify-content: center; padding-top: 60px; }
.sheet { width: 480px; background: var(--window); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 34px rgba(0,0,0,.3); padding: 20px 22px; }
.sheet h2 { font-size: 15px; margin: 0 0 6px; overflow-wrap: anywhere; }
.sheet .keep { margin: 12px 0 4px; padding: 9px 11px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.sheet .beside { display: flex; gap: 8px; align-items: flex-start; margin-top: 10px; }
.sheet .beside input { margin-top: 3px; }
.sheet .msg.help { margin: 2px 0 0 22px; font-size: 12px; color: var(--muted); }
.sheet .foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.sheet .btn { font: inherit; padding: 4px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--text); }
.sheet .go.danger { background: var(--bad); }
.top { display: flex; gap: 10px; align-items: baseline; }
.title[data-asset] { cursor: pointer; } .title[data-asset]:hover { color: var(--accent); }
.title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 550;
         -webkit-user-select: text; user-select: text; }
.state { color: var(--muted); white-space: nowrap; }
section.set p.autostate { margin-bottom: 1.4em; }   /* zo specifiek als section.set p, anders wint die */
.tag.draft { color: var(--accent); border-color: var(--accent); }
button.tag.jump { font-family: inherit; background: none; color: var(--accent); border-color: var(--accent); cursor: pointer; }
button.tag.jump:hover { background: var(--accent); color: #fff; }
.tag { font-size: 11px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; white-space: nowrap; }
.state.bezig { color: var(--accent); } .state.klaar { color: var(--good); } .state.fout { color: var(--bad); } .state.afgebroken { color: var(--muted); } .state.teruggezet { color: var(--warn); }
.msg { color: var(--muted); margin-top: 2px; -webkit-user-select: text; user-select: text; }
.msg.fout { color: var(--bad); }
.stages { display: grid; grid-template-columns: 1fr 4fr 2fr 1fr; gap: 3px; margin-top: 8px; }
.stage b { display: block; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.stage b i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s; }
.stage.done b i { width: 100%; }
.stage.wait b i { width: 40%; animation: slide 1.4s ease-in-out infinite alternate; }
.stage span { display: block; margin-top: 3px; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stage.now span { color: var(--text); }
@keyframes slide { from { margin-left: 0; } to { margin-left: 60%; } }
@media (prefers-reduced-motion: reduce) { .stage.wait b i { animation: none; width: 100%; opacity: .45; } .total i, .stage b i { transition: none; } }
.tracks { margin-top: 9px; display: grid; grid-template-columns: auto 1fr auto; gap: 3px 10px; align-items: center; }
.tracks .nr { color: var(--muted); font-size: 11px; }
.tracks svg { width: 100%; height: 22px; display: block; background: color-mix(in srgb, var(--line) 45%, transparent); border-radius: 3px; }
.tracks .used { fill: var(--good); } .tracks .skip { fill: var(--idle); } .tracks .code { fill: var(--warn); }
.tracks .what { font-size: 11px; color: var(--muted); white-space: nowrap; }
.tracks .what.on { color: var(--text); }
.more { font-size: 11px; margin-left: 2px; }
.empty { color: var(--muted); padding: 60px 0 36px; text-align: center; max-width: 48ch; margin: 0 auto; }
.empty svg { width: 40px; height: 40px; fill: none; stroke: var(--idle); stroke-width: 1.5; stroke-linecap: round; }
.empty .et { font-size: 15px; font-weight: 600; color: var(--text); margin: 8px 0 4px; }
.strip { display: flex; gap: 18px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 12px; }
.strip > div { flex: 1; min-width: 0; } .strip dt { color: var(--muted); font-size: 12px; } .strip dd { margin: 0; display: flex; align-items: center; gap: 6px; }

button.go { font: inherit; padding: 4px 10px; border-radius: 5px; border: 0; background: var(--accent); color: #fff; margin-left: 6px; }
button.btn { font: inherit; padding: 4px 11px; border-radius: 5px; border: 1px solid var(--line); background: var(--surface); color: var(--text); margin-left: 6px; }

/* Lege lijst: een sleepzone die zonder Iconik werkt. */
.zone { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 6px;
        border: 2px dashed var(--idle); border-radius: 12px; padding: 48px 24px; min-height: 340px; color: var(--muted); }
.zone svg { width: 40px; height: 40px; fill: none; stroke: var(--idle); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.zone .et { font-size: 15px; font-weight: 600; color: var(--text); margin: 6px 0 0; }
.zone p { margin: 0; max-width: 52ch; }
.zone .acts { margin-top: 10px; } .zone .acts button { margin: 0 4px; }
.zone .iconik { font-size: 12px; margin-top: 10px; }
.foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 14px; }
/* Tijdens het slepen: een blauwe zone over de lijst. */
#drop { position: fixed; left: 22px; right: 22px; top: 60px; bottom: 16px; z-index: 30; border: 2px dashed var(--accent); border-radius: 12px;
        background: color-mix(in srgb, color-mix(in srgb, var(--window) 86%, var(--accent) 14%) 86%, transparent); display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 8px; text-align: center; pointer-events: none; }
#drop svg { width: 40px; height: 40px; fill: none; stroke: var(--accent); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
#drop .et { font-size: 15px; font-weight: 600; color: var(--accent); } #drop p { margin: 0; color: var(--muted); max-width: 52ch; }
/* Een gesleepte of gevolgde map als groep, met de bestanden eronder. */
.grp { display: flex; gap: 10px; align-items: center; padding: 9px 8px; border-bottom: 1px solid var(--line); }
.grp .fold { all: unset; width: 18px; text-align: center; color: var(--muted); cursor: pointer; }
.grp > svg { width: 18px; height: 18px; flex: none; fill: none; stroke: var(--muted); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.grp .gname { flex: 1; min-width: 0; } .grp .gname b { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grp .gname span { font-size: 12px; color: var(--muted); }
button.eye { display: flex; align-items: center; gap: 5px; font: inherit; font-size: 12px; padding: 2px 8px; border-radius: 5px;
             border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer; }
button.eye svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
button.eye.on { background: color-mix(in srgb, var(--accent) 12%, transparent); border-color: var(--accent); color: var(--accent); }
.job.child { padding-left: 54px; border-bottom-color: color-mix(in srgb, var(--line) 60%, transparent); }
.morerow { padding: 6px 8px 7px 54px; color: var(--muted); border-bottom: 1px solid var(--line); }
.newrow { padding: 8px 8px 9px 54px; border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); display: flex; gap: 10px; }
.newrow b { font-weight: 550; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.newrow span { color: var(--warn); white-space: nowrap; }
.job.gone .top, .job.gone .msg { opacity: .55; }
.state.gone { color: var(--muted); }
.state.plek { color: var(--warn); }
.place { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.place .why { color: var(--warn); flex: 1; min-width: 0; }
.place button { margin-left: 0; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="bar">
  <h1>Local Transcribe</h1>
  <button id="status" hidden><i class="dot" id="dot"></i><span id="who"></span></button>
  <button id="gear"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9.23 4.92 L10.24 2.16 L13.76 2.16 L14.77 4.92 L15.05 5.04 L17.72 3.80 L20.20 6.28 L18.96 8.95 L19.08 9.23 L21.84 10.24 L21.84 13.76 L19.08 14.77 L18.96 15.05 L20.20 17.72 L17.72 20.20 L15.05 18.96 L14.77 19.08 L13.76 21.84 L10.24 21.84 L9.23 19.08 L8.95 18.96 L6.28 20.20 L3.80 17.72 L5.04 15.05 L4.92 14.77 L2.16 13.76 L2.16 10.24 L4.92 9.23 L5.04 8.95 L3.80 6.28 L6.28 3.80 L8.95 5.04Z"/><circle cx="12" cy="12" r="3"/></svg></button>
</div>
<div class="menu" id="menu" role="menu" hidden></div>
<div class="back" id="sheet" hidden></div>
<div id="drop" hidden><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v11M7 9l5 5 5-5M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg>
  <div class="et" data-t="dropRelease"></div><p data-t="dropHelp"></p></div>
<main>
  <div class="note" id="note" hidden></div>
  <div class="note" id="storageOff" hidden></div>
  <div class="note" id="button" hidden><span id="buttonText"></span> <button class="plain" id="install"></button></div>
  <div class="note" id="update" hidden><span id="updateText"></span> <button class="plain" id="getUpdate"></button> <button class="plain" id="openUpdate" hidden></button></div>
  <div id="jobs">
    <header><h2 data-t="jobs"></h2><button class="plain" id="clear" data-t="clear"></button></header>
    <div class="strip" id="strip" hidden></div>
    <div class="summary" id="summary"></div>
    <div id="list"></div>
  </div>
</main>
<script>
const NOTE = "__NOTE__";
const TEXT = {
  nl: {
    jobs: "Opdrachten", settings: "Instellingen", clear: "Wis afgeronde",
    emptyTitle: "Nog geen opdrachten", connect: "Verbinden met Iconik…",
    dropTitle: "Sleep video- of audiobestanden hierheen", dropText: "Het transcript komt naast de media. Open het daarna in Refine om te corrigeren of ondertitels te maken.",
    dropTextFolder: "Het transcript komt in de map voor transcripten (Instellingen › Bestanden). Open het daarna in Refine om te corrigeren of ondertitels te maken.",
    chooseFiles: "Kies bestanden…", watchFolder: "Map volgen…", iconikLine: "Of kies in Iconik een asset of collectie en kies Local Transcribe.",

    dropRelease: "Laat los om toe te voegen", dropHelp: "Een map komt als groep in de lijst, met alle video en audio erin en in de submappen. Met Volgen bij de map houdt de app hem daarna in de gaten.",
    footDrop: "Sleep bestanden of een map op het venster om ze toe te voegen, of", footChoose: "kies bestanden…",
    local: "Lokaal", follow: "Volgen", following: "Gevolgd", followTip: "Map volgen: nieuwe bestanden in deze map komen er vanzelf bij, als deze Mac ruimte heeft.",

    groupCount: (n, c) => `${n} ${n === 1 ? "bestand" : "bestanden"}` + (c.length ? ": " + c.join(", ") : ""),
    groupParts: {nieuw: n => `${n} nieuw`, klaar: n => `${n} klaar`, bezig: n => `${n} bezig`, wachtend: n => `${n} ${n === 1 ? "wacht" : "wachten"}`, gepauzeerd: n => `${n} gepauzeerd`, fout: n => `${n} fout`, overgeslagen: n => `${n} overgeslagen`, gone: n => `${n} weggehaald`},

    reveal: "Toon in Finder", existing: "bestaand transcript neergezet", gone: "niet meer in de map", checking: "controleert het bestand…",
    stripWatch: "Gevolgde mappen", watchIdle: n => `${n} ${n === 1 ? "map" : "mappen"}, niets nieuw`, watchNew: n => `${n} nieuw`,
    watchWait: (n, why) => `${n} nieuw, wacht: ${why}`, watchOff: names => `${names} niet bereikbaar`,
    watchSettling: (n, names) => n === 1 ? `Nieuw: ${names[0] || "1 bestand"}. Controleert het bestand…` : `${n} nieuw. Controleert de bestanden…`,
    emptyConnect: "Opdrachten komen uit Iconik. Verbind deze Mac eerst, kies daarna in Iconik een asset of collectie en kies Local Transcribe.",
    stripRemote: "Op afstand", stripAuto: "Automatisch", stripStorage: "Opslag (ISG)", remoteOn: "Aan, wacht op aanvragen", remoteOff: "Uit",
    storageOk: "gekoppeld", storageGone: names => `${names} niet bereikbaar`, storageChecking: "Kijkt of de opslag bereikbaar is…", toIntegrations: "Opent Instellingen › Integraties",
    allOn: n => `Ingelogd bij ${n} Iconiks`, notAllOn: names => `Niet ingelogd: ${names}`,
    openRefine: "Openen in Refine", openIconik: "Openen in Iconik", removeRow: "Verwijder uit lijst", removeAll: "Verwijder ook van deze Mac…",
    removeAllTip: "Wist wat de app op deze Mac over dit item bewaart: de kopie van het transcript, golfvormen, concept en origineel van Refine. Het mediabestand blijft altijd staan.",
    removeTitle: t => `„${t}” ook van deze Mac verwijderen?`,
    removeText: "De app wist wat hij zelf over dit item bewaart: de opdracht (ook andere regels van hetzelfde item), de kopie van het transcript, golfvormen, en het concept, het origineel en de ondertitellaag van Refine.",
    removeKeep: "Blijft altijd staan: het mediabestand zelf, en alles in Iconik.",
    removeBeside: name => `Ook het transcript naast de media (${name})`,

    trashed: (n, kept) => (n ? `${n} bestand${n === 1 ? "" : "en"} naast de media naar de prullenmand.` : "")

    wipeKeep: "Blijft staan: het mediabestand, en alles in Iconik. Ook als dit bestand op de opslag van Iconik (ISG) staat, gaat alleen dit bestand weg.",
    wipeAnyway: "Toch wissen…", wipe: "Wis definitief", wipeFailed: "Wissen lukte niet.",
    wipeTitle: names => names.length === 1 ? `„${names[0]}” definitief wissen?` : `${names.length} bestanden definitief wissen?`,
    wipeText: "Deze schijf heeft geen prullenmand. Gewist is weg: dit kan niet ongedaan worden. Alleen wat de app zelf schreef en daarna niet veranderde.",
    wiped: (n, kept) => (n ? `${n} bestand${n === 1 ? "" : "en"} definitief gewist.` : "")
      + (kept.length ? ` Blijft staan: ${kept.map(([f, why]) => `${f} (${why})`).join(", ")}.` : ""),
    removeLog: "De naam kan nog in het log staan.", clearLog: "Log wissen", logCleared: "Log gewist.", cancel: "Annuleer", remove: "Verwijder", mountsTitle: "ISG Mount Points",
    change: "Kies andere map",
    updateAvail: v => `Versie ${v} van Local Transcribe for Iconik is beschikbaar.`, updateGet: "Downloaden", updateInstall: "Installeren", updateRetry: "Opnieuw proberen", updateFull: "Deze versie vraagt een nieuwe installatie.", updateBusy: v => `Versie ${v} wordt gedownload en gecontroleerd...`, updateReady: v => `Versie ${v} is geïnstalleerd. De app start opnieuw op...`, updateWaiting: v => `Versie ${v} staat klaar. De app start opnieuw op zodra de opdrachten klaar zijn.`, updateFail: e => `Updaten is mislukt: ${e}`, version: "Versie",

    btnInstall: "Zet de knoppen in Iconik", btnPresent: "De knoppen Local Transcribe en Refine transcript staan in Iconik.",
    btnDenied: "Je account mag geen Custom Actions aanmaken. Vraag een Iconik-beheerder om één keer in deze app in te loggen en de knop te plaatsen.",
    workerTitle: "Op afstand", workerOn: "Opdrachten op afstand toestaan",

const STAGE_KEYS = ["audio", "transcriberen", "sprekers", "schrijven"];
const open = {};
let drawn = {}, lang = "en", T = TEXT.en, started = false;

const $ = id => document.getElementById(id);
// Verzoeken die iets veranderen gaan met deze header; de ontvanger weigert ze zonder (zie PROTECTED in serve.py).
const H = { method: "POST", headers: { "X-Local-Transcribe": "1" } };   // alles wat iets verandert is een POST
const act = path => fetch(path, H);
const esc = text => String(text ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const clock = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s % 60).padStart(2, "0"); };
const num = (n, d = 1) => lang === "nl" ? n.toFixed(d).replace(".", ",") : n.toFixed(d);

function setLanguage(choice) {
  lang = choice === "nl" ? "nl" : "en";
  T = TEXT[lang]; drawn = {}; $("list").innerHTML = "";
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = T[el.dataset.t]);
}
function note(text) {
  if (lang === "nl") return text;
  const same = /^zelfde signaal als spoor (\d+)$/.exec(text);
  return same ? `same signal as track ${same[1]}` : T.notes[text] || text;
}

if (NOTE) { $("note").textContent = NOTE; $("note").hidden = false; }
$("clear").onclick = () => act("/clear").then(tick);
let jobsByN = {};
function select(n) { selected = n; drawn = Object.fromEntries(Object.entries(drawn).filter(([k]) => !k.startsWith("job-"))); tick(); }
async function removeJob(n, everything, beside) {
  const r = await fetch(`/jobs/remove?n=${n}${everything ? "&all=1" : ""}${beside ? "&beside=1" : ""}`, H).then(r => r.json()).catch(() => ({ok: false}));
  if (!r.ok && r.error) { $("note").textContent = r.error; $("note").hidden = false; }
  if (r.ok && beside && ((r.trashed || []).length || (r.kept || []).length)) {
    const text = T.trashed((r.trashed || []).length, r.kept || []).trim();
    $("note").textContent = text; $("note").hidden = false;
    if (r.wipe) {   // geen prullenmand: Toch wissen, met een tweede bevestiging; de melding blijft dan staan
      const b = document.createElement("button");
      b.className = "plain"; b.id = "wipeAnyway"; b.textContent = T.wipeAnyway;
      b.onclick = () => confirmWipe(r.wipe);
      $("note").append(" ", b);
    } else {
      setTimeout(() => { if ($("note").textContent === text) $("note").hidden = true; }, 8000);   // een melding, geen blijvende staat
    }
  }
  if (r.ok) selected = null;
  tick();
}
// Een asset openen in de Iconik waar de opdracht vandaan komt (het item zegt welke).
const openAsset = (asset, item) => "/asset/open?id=" + encodeURIComponent(asset) + (item ? "&item=" + encodeURIComponent(item) : "");
function closeMenu() { $("menu").hidden = true; $("menu").innerHTML = ""; }
function openMenu(job, x, y) {
  const can = removable(job), ref = job.item, asset = job.asset_id;
  const item = (id, label, on, key = "", tip = "") => `<button role="menuitem" data-act="${id}"${on ? "" : " disabled"}${tip ? ` title="${esc(tip)}"` : ""}><span>${esc(label)}</span><kbd>${key}</kbd></button>`;
  $("menu").innerHTML = item("refine", T.openRefine, job.status === "klaar" && !!ref)
    + (job.local ? item("finder", T.reveal, !job.gone) : item("iconik", T.openIconik, !!asset))
    + "<hr>" + item("remove", T.removeRow, can, "⌫") + item("all", T.removeAll, can && !!ref, "", T.removeAllTip);
  const m = $("menu");
  m.hidden = false;
  m.style.left = Math.min(x, innerWidth - m.offsetWidth - 8) + "px";
  m.style.top = Math.min(y, innerHeight - m.offsetHeight - 8) + "px";
  m.onclick = e => {
    const b = e.target.closest("button[data-act]"); if (!b || b.disabled) return;
    closeMenu();
    if (b.dataset.act === "refine") location.href = "/refine?item=" + encodeURIComponent(ref);
    else if (b.dataset.act === "iconik") act(openAsset(asset, ref));
    else if (b.dataset.act === "finder") act("/local/reveal?n=" + job.n);
    else if (b.dataset.act === "remove") removeJob(job.n, false);
    else confirmAll(job);
  };
}
function confirmWipe(offer) {
  $("sheet").innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(T.wipeTitle(offer.names))}">
    <h2>${esc(T.wipeTitle(offer.names))}</h2><p class="msg">${esc(T.wipeText)}</p>
    <div class="keep"><b>${esc(T.wipeKeep)}</b></div>
    <div class="foot"><button class="btn" id="sheetCancel">${esc(T.cancel)}</button><button class="go danger" id="sheetWipe">${esc(T.wipe)}</button></div></div>`;
  $("sheet").hidden = false;
  $("sheetCancel").focus();
  $("sheetCancel").onclick = closeSheet;
  $("sheetWipe").onclick = async () => {
    closeSheet();
    const r = await fetch("/local/wipe?token=" + encodeURIComponent(offer.token), H).then(r => r.json()).catch(() => ({ok: false}));
    const text = r.ok ? T.wiped((r.wiped || []).length, r.kept || []).trim() : (r.error || T.wipeFailed);
    $("note").textContent = text; $("note").hidden = false;
    setTimeout(() => { if ($("note").textContent === text) $("note").hidden = true; }, 8000);
  };
}
function closeSheet() { $("sheet").hidden = true; $("sheet").innerHTML = ""; }
function confirmAll(job) {
  $("sheet").innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(T.removeTitle(job.title || job.asset_id))}">
    <h2>${esc(T.removeTitle(job.title || job.asset_id))}</h2><p class="msg">${esc(T.removeText)}</p>
    <div class="keep"><b>${esc(T.removeKeep)}</b></div>
    ${job.local ? `<label class="beside"><input type="checkbox" id="sheetBeside"><span>${esc(T.removeBeside((job.title || "").replace(/\.[^.]*$/, "") + ".transcript.json"))}</span></label>
    <p class="msg help">${esc(T.removeBesideHelp)}</p>` : ""}
    <p class="msg">${esc(T.removeLog)} <button class="plain" id="clearLog">${esc(T.clearLog)}</button></p>
    <div class="foot"><button class="btn" id="sheetCancel">${esc(T.cancel)}</button><button class="go danger" id="sheetRemove">${esc(T.remove)}</button></div></div>`;
  $("sheet").hidden = false;
  $("sheetCancel").focus();
  $("sheetCancel").onclick = closeSheet;
  $("clearLog").onclick = async e => { const r = await act("/log/clear").then(r => r.json()).catch(() => ({})); if (r.ok) e.target.replaceWith(T.logCleared); };
  $("sheetRemove").onclick = () => { const beside = !!($("sheetBeside") && $("sheetBeside").checked); closeSheet(); removeJob(job.n, true, beside); };
}
document.addEventListener("click", e => { if (!e.target.closest("#menu")) closeMenu(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeMenu(); closeSheet(); return; }
  if (!$("sheet").hidden || e.target.matches("input, textarea, select")) return;
  if ((e.key === "Backspace" || e.key === "Delete") && selected != null && jobsByN[selected] && removable(jobsByN[selected])) {
    e.preventDefault(); removeJob(selected, false);

    const id = "job-" + job.n, isOpen = open[job.n] ?? job.status === "bezig";
    jobsByN[job.n] = job;
    const el = put(id, "job" + (child ? " child" : "") + (job.gone ? " gone" : ""), row(job, isOpen));
    el.classList.toggle("sel", job.n === selected);
    el.querySelector(".el").textContent = job.status === "bezig" ? " " + clock(job.elapsed || 0) : "";
  };
  for (const block of blocks) {
    if (block.job) { putJob(block.job, false); continue; }
    const id = gid(block.group.path);
    put(id, "grp", groupHead(block.group, block.jobs));
    if (folded[block.group.path]) continue;
    (block.group.new || []).forEach(name => put(id + "-new-" + gid(name), "newrow", `<b>${esc(name)}</b><span>${T.checking}</span>`));
    const all = !!showAll[block.group.path], shown = all ? block.jobs : block.jobs.slice(0, SHOWN);
    shown.forEach(j => putJob(j, true));
    if (block.jobs.length > SHOWN)
      put(id + "-more", "morerow", all ? `<button class="plain" data-more="${esc(block.group.path)}">${T.showLess}</button>`
        : `${T.showAll(block.jobs.length - SHOWN)} <button class="plain" data-more="${esc(block.group.path)}">${T.showAllLink}</button>`);
  }
  [...list.children].forEach(el => { if (!seen.has(el.id)) { delete drawn[el.id]; el.remove(); } });
  // Onder de lijst: hoe er meer bij komt.
  const foot = `${T.footDrop} <button class="plain" id="chooseFiles">${T.footChoose}</button>`;
  let f = $("foot");
  if (!f) { f = document.createElement("div"); f.id = "foot"; f.className = "foot"; $("jobs").appendChild(f); }
  if (drawn.foot !== foot) { f.innerHTML = foot; drawn.foot = foot; }
}
// Slepen: de blauwe zone zolang er bestanden boven het venster hangen. Het loslaten zelf vangt de app op (zij krijgt
// de echte paden, dit venster alleen de namen); hier alleen de zone weg en de lijst verversen.
// Niet alleen op dragleave en drop vertrouwen: wordt een schijf tijdens het slepen uitgeworpen, dan komt geen van beide
// (gezien 26 november, de zone bleef staan). Zolang er boven het venster gesleept wordt, komt er steeds dragover; blijft
// dat een halve seconde uit, dan is het slepen voorbij.
let dragging = 0, lastOver = 0;
const withFiles = e => [...((e.dataTransfer && e.dataTransfer.types) || [])].includes("Files");
const dropZone = on => { $("drop").hidden = !on; if (!on) dragging = 0; else lastOver = Date.now(); };
document.addEventListener("dragenter", e => { if (!withFiles(e) || !$("sheet").hidden) return; dragging++; dropZone(true); });
document.addEventListener("dragover", e => { if (!withFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = "copy"; lastOver = Date.now(); });
setInterval(() => { if (!$("drop").hidden && Date.now() - lastOver > 500) dropZone(false); }, 200);
["dragend", "mousedown", "keydown", "blur"].forEach(kind => window.addEventListener(kind, () => { if (!$("drop").hidden) dropZone(false); }));
document.addEventListener("dragleave", e => { if (!withFiles(e)) return; if (--dragging <= 0) dropZone(false); });
document.addEventListener("drop", e => { if (!withFiles(e)) return; e.preventDefault(); dropZone(false); setTimeout(tick, 400); });

tick(); setInterval(tick, 1000);
</script>
</body>
</html>
