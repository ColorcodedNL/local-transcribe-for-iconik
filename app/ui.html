<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Transcribe for Iconik</title>
<style>
:root {
  --window: #f5f6f7; --side: #e9ebee; --surface: #ffffff; --line: #d9dde2;
  --text: #1c1f23; --muted: #6a727d; --accent: #1a6fe0;
  --good: #2e9a48; --warn: #b07a10; --bad: #c9412b; --idle: #b9bfc7;
}
@media (prefers-color-scheme: dark) {
  :root {
    --window: #1d2025; --side: #171a1e; --surface: #262a30; --line: #343941;
    --text: #e8eaed; --muted: #8d95a0; --accent: #4c9dff;
    --good: #62c370; --warn: #e0a83a; --bad: #e5634d; --idle: #4a505a;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; display: grid; grid-template-columns: 190px 1fr;
  background: var(--window); color: var(--text);
  font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  font-variant-numeric: tabular-nums; -webkit-user-select: none; user-select: none; cursor: default;
}
aside { background: var(--side); border-right: 1px solid var(--line); padding: 18px 10px 12px;
        display: flex; flex-direction: column; gap: 2px; }
aside h1 { font-size: 14px; font-weight: 650; margin: 0 8px 16px; letter-spacing: -.01em; }
aside h1 span { display: block; font-weight: 400; color: var(--muted); }
.nav { all: unset; padding: 6px 8px; border-radius: 6px; color: var(--text); }
.nav[aria-current="true"] { background: var(--accent); color: #fff; }
.nav:focus-visible, button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.who { margin-top: auto; padding: 8px; color: var(--muted); display: flex; gap: 7px; align-items: baseline; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); flex: none; }
.dot.on { background: var(--good); } .dot.off { background: var(--bad); }
main { overflow-y: auto; padding: 18px 22px 28px; }
header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; }
header h2 { font-size: 20px; font-weight: 650; margin: 0; letter-spacing: -.015em; flex: 1; }
button.plain, a.plain { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; text-decoration: none; cursor: pointer; }
button.plain:disabled { color: var(--idle); cursor: default; }
.note { background: color-mix(in srgb, var(--warn) 16%, transparent); border-left: 3px solid var(--warn);
        padding: 8px 10px; border-radius: 4px; margin-bottom: 12px; -webkit-user-select: text; user-select: text; }

.summary { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1.4fr; gap: 18px; padding: 12px 14px;
           background: var(--surface); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 16px; }
.summary dt { color: var(--muted); } .summary dd { margin: 0; font-size: 18px; font-weight: 600; }
.summary dl { margin: 0; min-width: 0; }
.total { height: 5px; border-radius: 3px; background: var(--line); margin-top: 7px; overflow: hidden; }
.total i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
.rate { display: flex; align-items: flex-end; gap: 10px; }
.speeds { display: flex; align-items: flex-end; gap: 2px; height: 24px; flex: 1; margin-bottom: 3px; }
.mount { display: flex; align-items: center; gap: 14px; padding: 4px 0; } .mount div { flex: 1; min-width: 0; }
.speeds i { flex: 1; max-width: 9px; background: var(--accent); border-radius: 1px 1px 0 0; min-height: 2px; }

.job { border-bottom: 1px solid var(--line); padding: 10px 2px 11px; }
.top { display: flex; gap: 10px; align-items: baseline; }
.title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 550;
         -webkit-user-select: text; user-select: text; }
.state { color: var(--muted); white-space: nowrap; }
.state.bezig { color: var(--accent); } .state.klaar { color: var(--good); } .state.fout { color: var(--bad); } .state.afgebroken { color: var(--muted); } .state.teruggezet { color: var(--warn); }
.msg { color: var(--muted); margin-top: 2px; -webkit-user-select: text; user-select: text; }
.msg.fout { color: var(--bad); }
.stages { display: grid; grid-template-columns: 1fr 4fr 2fr 1fr; gap: 3px; margin-top: 8px; }
.stage b { display: block; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.stage b i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s; }
.stage.done b i { width: 100%; }
.stage.wait b i { width: 40%; animation: slide 1.4s ease-in-out infinite alternate; }
.stage span { display: block; margin-top: 3px; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stage.now span { color: var(--text); }
@keyframes slide { from { margin-left: 0; } to { margin-left: 60%; } }
@media (prefers-reduced-motion: reduce) { .stage.wait b i { animation: none; width: 100%; opacity: .45; } .total i, .stage b i { transition: none; } }
.tracks { margin-top: 9px; display: grid; grid-template-columns: auto 1fr auto; gap: 3px 10px; align-items: center; }
.tracks .nr { color: var(--muted); font-size: 11px; }
.tracks svg { width: 100%; height: 22px; display: block; background: color-mix(in srgb, var(--line) 45%, transparent); border-radius: 3px; }
.tracks .used { fill: var(--good); } .tracks .skip { fill: var(--idle); } .tracks .code { fill: var(--warn); }
.tracks .what { font-size: 11px; color: var(--muted); white-space: nowrap; }
.tracks .what.on { color: var(--text); }
.more { font-size: 11px; margin-left: 2px; }
.empty { color: var(--muted); padding: 36px 0; text-align: center; max-width: 46ch; margin: 0 auto; }

section.set { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; max-width: 640px; }
section.set h3 { font-size: 13px; font-weight: 650; margin: 0 0 6px; }
section.set p { margin: 4px 0; } section.set .dim { color: var(--muted); }
section.set code { font: 12px ui-monospace, Menlo, monospace; -webkit-user-select: text; user-select: text; }
input, select { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--window); color: var(--text); width: 300px; }
button.go { font: inherit; padding: 4px 10px; border-radius: 5px; border: 0; background: var(--accent); color: #fff; margin-left: 6px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<aside>
  <h1>Local Transcribe <span>for Iconik</span></h1>
  <button class="nav" data-view="jobs" aria-current="true" data-t="jobs"></button>
  <button class="nav" data-view="settings" data-t="settings"></button>
  <div class="who"><i class="dot" id="dot"></i><span id="who"></span></div>
</aside>
<main>
  <div class="note" id="note" hidden></div>
  <div class="note" id="button" hidden><span id="buttonText"></span> <button class="plain" id="install"></button></div>
  <div class="note" id="update" hidden><span id="updateText"></span> <button class="plain" id="getUpdate"></button> <button class="plain" id="openUpdate" hidden></button></div>
  <div id="jobs">
    <header><h2 data-t="jobs"></h2><button class="plain" id="clear" data-t="clear"></button></header>
    <div class="summary" id="summary"></div>
    <div id="list"></div>
  </div>
  <div id="settings" hidden>
    <header><h2 data-t="settings"></h2></header>
    <section class="set"><h3>Iconik</h3><div id="account"></div></section>
    <section class="set"><h3 data-t="mountsTitle"></h3><div id="mounts"></div></section>
    <section class="set"><h3 data-t="modelsTitle"></h3><div id="models"></div></section>
    <section class="set"><h3 data-t="workerTitle"></h3><div id="worker"></div></section>
    <section class="set"><h3 data-t="spoken"></h3><p>
      <select id="spoken"><option value="auto" data-t="spokenAuto"></option><option value="nl">Nederlands</option><option value="en">English</option><option value="de" data-name="Deutsch" data-untested>Deutsch</option><option value="fr" data-name="Français" data-untested>Français</option><option value="es" data-name="Español" data-untested>Español</option><option value="it" data-name="Italiano" data-untested>Italiano</option><option value="sv" data-name="Svenska" data-untested>Svenska</option></select></p>
      <p class="dim" data-t="spokenHelp"></p></section>
    <section class="set"><h3 data-t="language"></h3><p>
      <select id="lang"><option value="auto" data-t="langAuto"></option><option value="nl">Nederlands</option><option value="en">English</option></select></p></section>
  </div>
</main>
<script>
const NOTE = "__NOTE__";
const TEXT = {
  nl: {
    jobs: "Opdrachten", settings: "Voorkeuren", clear: "Wis afgeronde", mountsTitle: "ISG Mount Points",
    change: "Kies andere map", remove: "Verwijder",
    updateAvail: v => `Versie ${v} van Local Transcribe for Iconik is beschikbaar.`, updateGet: "Downloaden", updateInstall: "Installeren", updateRetry: "Opnieuw proberen", updateFull: "Deze versie vraagt een nieuwe installatie.", updateBusy: v => `Versie ${v} wordt gedownload en gecontroleerd...`, updateReady: v => `Versie ${v} is geïnstalleerd. De app start opnieuw op...`, updateWaiting: v => `Versie ${v} staat klaar. De app start opnieuw op zodra de opdrachten klaar zijn.`, updateFail: e => `Updaten is mislukt: ${e}`, version: "Versie",
    btnMissing: "De knop Local Transcribe staat nog niet in deze Iconik-omgeving. Dat hoeft maar één keer, voor alle gebruikers tegelijk.",
    btnInstall: "Zet de knop in Iconik", btnPresent: "De knop Local Transcribe staat in Iconik.",
    btnDenied: "Je account mag geen Custom Actions aanmaken. Vraag een Iconik-beheerder om één keer in deze app in te loggen en de knop te plaatsen.",
    workerTitle: "Op afstand", workerOn: "Opdrachten op afstand toestaan",
    workerHelp: "Staat opdrachten uit Iconik toe vanaf elke locatie. Dit draait op de achtergrond. De opslag (ISG) moet op deze Mac gemount zijn.",
    loginOn: "Opstarten bij inloggen", loginHelp: "Opent de app bij het inloggen. Staat opdrachten op afstand aan, dan blijft hij in de menubalk.",
    fieldsLang: "Taal van de velden in Iconik",
    fieldsHelp: "Wat mensen in Iconik zien bij Transcriptie en de keuzes Aangevraagd, Bezig, Klaar en Fout. Geldt voor iedereen in deze Iconik-omgeving en vraagt beheerrechten. Een view die het veld al bevat, houdt zijn eigen kopie: voeg het veld daar opnieuw toe.",
    fieldsDone: "Bijgewerkt in Iconik.", fieldsFail: "Niet gelukt",
    workerLast: "Laatst gecontroleerd", workerPaused: "Gepauzeerd tot", resumeNow: "Nu hervatten", workerAsset: "Laatst opgepakt", workerProblem: "Probleem", workerAs: "Naam",
    modelsTitle: "Modellen", language: "Taal van de app", spoken: "Gesproken taal", spokenAuto: "Herken per asset", untested: "niet getest",
    spokenHelp: "Herkennen kijkt naar de luidste stukken van de opname. Zet de taal alleen vast als al je materiaal in één taal is. Herkennen werkt ook voor andere talen die Whisper ondersteunt (niet getest). We hebben Nederlands en Engels getest.", langAuto: "Volg macOS",
    stages: ["Audio lezen", "Transcriberen", "Sprekers", "Naar Iconik"],
    download: "Whisper-model downloaden (eenmalig, ca. 3 GB)",
    status: {wachtend: "wacht sinds", bezig: "bezig", klaar: "klaar", overgeslagen: "overgeslagen", fout: "fout", afgebroken: "afgebroken", teruggezet: "teruggezet in de rij"},
    audioLength: "Audio duurt", result: (l, s) => `${l} ${l === 1 ? "regel" : "regels"}, ${s} ${s === 1 ? "spreker" : "sprekers"}`,
    doneIn: (t, x) => `klaar in ${t} (${x} keer realtime)`, hide: "Verberg sporen", tracks: n => `${n} ${n === 1 ? "spoor" : "sporen"}`,
    ignored: "genegeerd", done: "Afgerond", of: "van", audioDone: "Audio getranscribeerd", skipped: "Overgeslagen of fout",
    speed: "Snelheid, keer realtime", average: x => `gemiddeld ${x} keer realtime`, times: "keer realtime",
    empty: "Nog geen opdrachten. Kies in Iconik een asset of collectie en kies Local Transcribe.",
    clientId: "Client-ID van de applicatie die je Iconik-beheerder heeft aangemaakt:", save: "Opslaan en inloggen",
    accNone: "Nog niet verbonden met Iconik.", accOut: "Niet ingelogd.", otherId: "Andere Client ID gebruiken", login: "Log in bij Iconik", accUser: "Verbonden met Iconik.", accAs: "Ingelogd als",
    logout: "Log uit", accToken: "Verbonden met een persoonlijk token uit", loginOwn: "Log in met je eigen account",
    noMounts: "Nog geen mount point. De app vraagt om de map bij de eerste opdracht van een ISG.",
    speech: "Spraak", speakers: "Sprekers", spLocal: "pyannote community-1, meegeleverd met de app", spHub: "pyannote community-1, via Hugging Face",
    spOff: "geen model gevonden, sprekerherkenning staat uit",
    credit: "Sprekerherkenning gebruikt pyannote speaker-diarization-community-1 van pyannoteAI, licentie CC-BY-4.0. Spraakherkenning gebruikt Whisper large-v3 van OpenAI via MLX.",
    who: {geen: "Niet verbonden", uitgelogd: "Niet ingelogd", gebruiker: "Ingelogd bij Iconik", token: "Persoonlijk token"}, down: "Ontvanger reageert niet",
    notes: {},
  },
  en: {
    jobs: "Jobs", settings: "Preferences", clear: "Clear finished", mountsTitle: "ISG Mount Points",
    change: "Choose another folder", remove: "Remove",
    updateAvail: v => `Version ${v} of Local Transcribe for Iconik is available.`, updateGet: "Download", updateInstall: "Install", updateRetry: "Try again", updateFull: "This version needs a full install.", updateBusy: v => `Downloading and checking version ${v}...`, updateReady: v => `Version ${v} is installed. The app is restarting...`, updateWaiting: v => `Version ${v} is ready. The app restarts when the jobs are done.`, updateFail: e => `Updating failed: ${e}`, version: "Version",
    btnMissing: "The Local Transcribe button is not in this Iconik environment yet. This is needed only once, for all users at the same time.",
    btnInstall: "Add the button to Iconik", btnPresent: "The Local Transcribe button is in Iconik.",
    btnDenied: "Your account is not allowed to create Custom Actions. Ask an Iconik admin to log in to this app once and add the button.",
    workerTitle: "Remote", workerOn: "Allow remote jobs",
    workerHelp: "Allows jobs from Iconik from any location. This runs in the background. The storage (ISG) must be mounted on this Mac.",
    loginOn: "Open at login", loginHelp: "Opens the app when you log in. With remote jobs allowed it stays in the menu bar.",
    fieldsLang: "Language of the fields in Iconik",
    fieldsHelp: "What people see in Iconik for Transcription and the choices Requested, In progress, Done and Failed. Applies to everyone in this Iconik environment and needs admin rights. A view that already contains the field keeps its own copy: add the field to it again.",
    fieldsDone: "Updated in Iconik.", fieldsFail: "Did not work",
    workerLast: "Last checked", workerPaused: "Paused until", resumeNow: "Resume now", workerAsset: "Last picked up", workerProblem: "Problem", workerAs: "Name",
    modelsTitle: "Models", language: "App language", spoken: "Spoken language", spokenAuto: "Detect per asset", untested: "untested",
    spokenHelp: "Detection looks at the loudest parts of the recording. Only fix the language if all your footage is in one language. Detection also works for other languages Whisper supports (untested). We tested Dutch and English.", langAuto: "Follow macOS",
    stages: ["Read audio", "Transcribe", "Speakers", "Send to Iconik"],
    download: "Downloading Whisper model (once, about 3 GB)",
    status: {wachtend: "waiting since", bezig: "running", klaar: "done", overgeslagen: "skipped", fout: "failed", afgebroken: "interrupted", teruggezet: "back in the queue"},
    audioLength: "Audio length", result: (l, s) => `${l} ${l === 1 ? "line" : "lines"}, ${s} ${s === 1 ? "speaker" : "speakers"}`,
    doneIn: (t, x) => `done in ${t} (${x}x realtime)`, hide: "Hide tracks", tracks: n => `${n} ${n === 1 ? "track" : "tracks"}`,
    ignored: "ignored", done: "Finished", of: "of", audioDone: "Audio transcribed", skipped: "Skipped or failed",
    speed: "Speed, times realtime", average: x => `average ${x}x realtime`, times: "x realtime",
    empty: "No jobs yet. Pick an asset or collection in Iconik and choose Local Transcribe.",
    clientId: "Client ID of the application your Iconik admin created:", save: "Save and log in",
    accNone: "Not connected to Iconik yet.", accOut: "Not logged in.", otherId: "Use another Client ID", login: "Log in to Iconik", accUser: "Connected to Iconik.", accAs: "Logged in as",
    logout: "Log out", accToken: "Connected with a personal token from", loginOwn: "Log in with your own account",
    noMounts: "No mount point yet. The app asks for the folder on the first job from an ISG.",
    speech: "Speech", speakers: "Speakers", spLocal: "pyannote community-1, bundled with the app", spHub: "pyannote community-1, via Hugging Face",
    spOff: "no model found, speaker detection is off",
    credit: "Speaker detection uses pyannote speaker-diarization-community-1 by pyannoteAI, licensed CC-BY-4.0. Speech recognition uses Whisper large-v3 by OpenAI via MLX.",
    who: {geen: "Not connected", uitgelogd: "Not logged in", gebruiker: "Logged in to Iconik", token: "Personal token"}, down: "Receiver is not responding",
    notes: {"geluid": "audio", "stil": "silent", "tijdcode of toon": "timecode or tone", "eigen microfoon": "dedicated microphone", "gekozen spoor": "chosen track"},
  },
};
const STAGE_KEYS = ["audio", "transcriberen", "sprekers", "schrijven"];
const open = {};
let drawn = {}, view = "jobs", lang = "en", T = TEXT.en, started = false, landed = false;

const $ = id => document.getElementById(id);
// Verzoeken die iets veranderen gaan met deze header; de ontvanger weigert ze zonder (zie PROTECTED in serve.py).
const H = { headers: { "X-Local-Transcribe": "1" } };
const act = path => fetch(path, H);
const esc = text => String(text ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const clock = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s % 60).padStart(2, "0"); };
const num = (n, d = 1) => lang === "nl" ? n.toFixed(d).replace(".", ",") : n.toFixed(d);

function setLanguage(choice) {
  lang = choice === "nl" ? "nl" : "en";
  T = TEXT[lang]; drawn = {}; $("list").innerHTML = "";
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = T[el.dataset.t]);
  document.querySelectorAll("option[data-untested]").forEach(el => el.textContent = el.dataset.name + " (" + T.untested + ")");
}
function note(text) {
  if (lang === "nl") return text;
  const same = /^zelfde signaal als spoor (\d+)$/.exec(text);
  return same ? `same signal as track ${same[1]}` : T.notes[text] || text;
}

if (NOTE) { $("note").textContent = NOTE; $("note").hidden = false; }
document.querySelectorAll(".nav").forEach(b => b.onclick = () => {
  view = b.dataset.view;
  document.querySelectorAll(".nav").forEach(x => x.setAttribute("aria-current", x === b));
  $("jobs").hidden = view !== "jobs"; $("settings").hidden = view !== "settings";
});
$("clear").onclick = () => act("/clear").then(tick);
$("list").onclick = e => { const b = e.target.closest("[data-toggle]"); if (b) { open[b.dataset.toggle] = b.dataset.open !== "1"; tick(); } };
$("mounts").onclick = e => { const b = e.target.closest("[data-mount]"); if (b) { b.blur(); act(`/mount/${b.dataset.mount}?id=${encodeURIComponent(b.dataset.id)}`).then(tick); } };
$("spoken").onchange = e => { e.target.blur(); act("/language?value=" + e.target.value).then(tick); };
$("getUpdate").onclick = () => act("/update/install");
$("openUpdate").onclick = () => act("/update/open");
$("install").onclick = e => { e.target.disabled = true; act("/actions/install").then(tick).finally(() => e.target.disabled = false); };
let fieldsMsg = "";
function fieldsHtml(w) {
  const cur = w.iconik_language || "nl";
  return `<p>${T.fieldsLang} <select id="fieldsLang" style="width:auto"><option value="nl"${cur === "nl" ? " selected" : ""}>Nederlands</option><option value="en"${cur === "en" ? " selected" : ""}>English</option></select></p><p class="dim">${T.fieldsHelp}</p>` + (fieldsMsg ? `<p>${esc(fieldsMsg)}</p>` : "");
}
$("worker").onchange = e => {
  const h = { headers: { "X-Local-Transcribe": "1" } };
  if (e.target.id === "loginOn") { e.target.blur(); fetch("/login-item?value=" + (e.target.checked ? "on" : "off"), h).then(tick); return; }
  if (e.target.id === "workerOn") { e.target.blur(); fetch("/worker?value=" + (e.target.checked ? "on" : "off"), h).then(tick); return; }
  if (e.target.id === "fieldsLang") {
    const value = e.target.value; e.target.blur(); fieldsMsg = "";
    fetch("/iconik-language?value=" + value, h).then(r => r.json()).then(r => { fieldsMsg = r.ok ? T.fieldsDone : T.fieldsFail + ": " + (r.error || ""); tick(); }).catch(() => { fieldsMsg = T.fieldsFail; tick(); });
  }
};
$("worker").onclick = e => {
  if (e.target.id === "resumeNow") { e.target.disabled = true; act("/worker?value=resume").then(tick); }
};
$("account").onclick = e => {
  if (e.target.id !== "logout") return;
  e.preventDefault(); act("/logout").then(tick);
};
$("account").onsubmit = e => {
  if (e.target.id !== "clientForm") return;
  e.preventDefault();
  const id = new FormData(e.target).get("client_id") || "";
  act("/settings?client_id=" + encodeURIComponent(id)).then(r => r.json()).then(r => {
    if (r.ok) { location.href = "/login"; return; }
    $("note").textContent = r.error; $("note").hidden = false;
  });
};
$("lang").onchange = e => { e.target.blur(); act("/applang?value=" + e.target.value).then(tick); };

function wave(track) {
  const env = track.env || [], n = env.length;
  if (n < 2) return "<svg></svg>";
  let up = "", down = "";
  env.forEach((v, i) => { up += `${i},${(10 - v * 9.5).toFixed(1)} `; down = `${i},${(10 + v * 9.5).toFixed(1)} ` + down; });
  const kind = track.used ? "used" : track.note.startsWith("tijdcode") ? "code" : "skip";
  return `<svg viewBox="0 0 ${n - 1} 20" preserveAspectRatio="none" aria-hidden="true"><polygon class="${kind}" points="${up}${down}"/></svg>`;
}

function stages(job) {
  if (job.stage === "model") {
    const wait = job.fraction == null;
    const bar = wait ? "<i></i>" : `<i style="width:${(job.fraction * 100).toFixed(1)}%"></i>`;
    const pct = wait ? "" : " " + Math.round(job.fraction * 100) + "%";
    return `<div class="stages" style="grid-template-columns:1fr"><div class="stage now${wait ? " wait" : ""}"><b>${bar}</b><span>${T.download}${pct}</span></div></div>`;
  }
  const at = STAGE_KEYS.indexOf(job.stage);
  return '<div class="stages">' + T.stages.map((label, i) => {
    if (i < at) return `<div class="stage done"><b><i></i></b><span>${label}</span></div>`;
    if (i > at) return `<div class="stage"><b><i></i></b><span>${label}</span></div>`;
    if (job.fraction == null) return `<div class="stage now wait"><b><i></i></b><span>${label}</span></div>`;
    return `<div class="stage now"><b><i style="width:${(job.fraction * 100).toFixed(1)}%"></i></b><span>${label} ${Math.round(job.fraction * 100)}%</span></div>`;
  }).join("") + "</div>";
}

function row(job, isOpen) {
  let state = T.status[job.status] || job.status, msg = job.message || "";
  if (job.status === "bezig") msg = job.duration ? T.audioLength + " " + clock(job.duration) : "";
  else if (job.status === "klaar") {
    if (job.result) msg = T.result(job.result.segments, job.result.speakers) + (job.language ? ", " + job.language.toUpperCase() : "");
    if (job.elapsed && job.duration) msg += ", " + T.doneIn(clock(job.elapsed), num(job.duration / job.elapsed));
  } else if (job.status === "wachtend") state += " " + job.added;
  const tracks = job.tracks || [];
  const toggle = tracks.length ? `<button class="plain more" data-toggle="${job.n}" data-open="${isOpen ? 1 : 0}">${isOpen ? T.hide : T.tracks(tracks.length)}</button>` : "";
  let html = `<div class="top"><div class="title">${esc(job.title || job.asset_id)}</div>${toggle}<div class="state ${job.status}">${esc(state)}<span class="el"></span></div></div>`;
  if (msg) html += `<div class="msg ${job.status === "fout" ? "fout" : ""}">${esc(msg)}</div>`;
  if (job.status === "bezig") html += stages(job);
  if (isOpen && tracks.length) html += '<div class="tracks">' + tracks.map(t =>
    `<div class="nr">${t.n}</div>${wave(t)}<div class="what ${t.used ? "on" : ""}">${esc(note(t.note))}${t.used ? "" : ", " + T.ignored}, ${num(t.db)} dB</div>`).join("") + "</div>";
  return html;
}

function summary(all) {
  const jobs = all.filter(j => !["afgebroken", "teruggezet"].includes(j.status));   // telt niet mee in de cijfers
  const done = jobs.filter(j => !["wachtend", "bezig"].includes(j.status));
  const good = jobs.filter(j => j.status === "klaar" && j.elapsed && j.duration);
  const audio = good.reduce((a, j) => a + j.duration, 0), spent = good.reduce((a, j) => a + j.elapsed, 0);
  const share = jobs.length ? done.length / jobs.length : 0;
  const last = good.slice(0, 30).reverse(), top = Math.max(1, ...last.map(j => j.duration / j.elapsed));
  const other = jobs.filter(j => ["overgeslagen", "fout"].includes(j.status)).length;
  $("summary").innerHTML =
    `<dl><dt>${T.done}</dt><dd>${done.length} ${T.of} ${jobs.length}</dd><div class="total"><i style="width:${share * 100}%"></i></div></dl>` +
    `<dl><dt>${T.audioDone}</dt><dd>${clock(audio)}</dd></dl>` +
    `<dl><dt>${T.skipped}</dt><dd>${other}</dd></dl>` +
    `<dl><dt>${T.speed}</dt><div class="rate"><dd>${spent ? num(audio / spent) + "×" : "&nbsp;"}</dd>` +
    (last.length ? `<div class="speeds">${last.map(j => `<i title="${esc(j.title)}: ${num(j.duration / j.elapsed)} ${T.times}" style="height:${Math.max(6, j.duration / j.elapsed / top * 100)}%"></i>`).join("")}</div>` : "") + `</div></dl>`;
  $("clear").disabled = !all.some(j => !["wachtend", "bezig"].includes(j.status));
}

function settings(s) {
  const form = `<form id="clientForm"><p>${T.clientId}</p><p><input name="client_id" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"><button class="go">${T.save}</button></p></form>`;
  const account = {
    geen: `<p>${T.accNone}</p>` + form,
    uitgelogd: `<p>${T.accOut} <a class="plain" href="/login">${T.login}</a></p><details><summary>${T.otherId}</summary>${form}</details>`,
    gebruiker: `<p>${s.user ? T.accAs + " " + esc(s.user) + "." : T.accUser} <a class="plain" href="/" id="logout">${T.logout}</a></p>` + (s.actions === "aanwezig" ? `<p class="dim">${T.btnPresent}</p>` : ""),
    token: `<p>${T.accToken} <code>~/.iconik-env</code>.</p>` + (s.has_client_id ? `<p><a class="plain" href="/login">${T.loginOwn}</a></p>` : form),
  }[s.account];
  const mounts = s.mounts;
  $("button").hidden = !["ontbreekt", "geweigerd"].includes(s.actions);
  $("buttonText").textContent = s.actions === "geweigerd" ? T.btnDenied : T.btnMissing;
  $("install").textContent = T.btnInstall; $("install").hidden = s.actions === "geweigerd";
  $("update").hidden = !s.update;
  if (s.update) {
    const u = s.update;
    let text = T.updateAvail(u.version), install = false, download = false;
    if (u.state === "installing") text = T.updateBusy(u.version);
    else if (u.state === "ready") text = u.waiting ? T.updateWaiting(u.version) : T.updateReady(u.version);
    else if (u.state === "error") { text = T.updateFail(u.error); install = true; download = true; }
    else if (u.mode === "code") install = true;
    else { text += " " + T.updateFull; download = true; }
    $("updateText").textContent = text;
    $("getUpdate").hidden = !install; $("getUpdate").textContent = u.state === "error" ? T.updateRetry : T.updateInstall;
    $("openUpdate").hidden = !download; $("openUpdate").textContent = T.updateGet;
  }
  const html = {
    account,
    mounts: mounts.length ? mounts.map(m => `<div class="mount"><div><strong>${esc(m.name || "ISG " + m.id)}</strong><br><code>${esc(m.path)}</code></div><button class="plain" data-mount="change" data-id="${esc(m.id)}">${T.change}</button><button class="plain" data-mount="remove" data-id="${esc(m.id)}">${T.remove}</button></div>`).join("") : `<p class="dim">${T.noMounts}</p>`,
    worker: (w => `<p><label><input type="checkbox" id="workerOn" style="width:auto;margin:0 .5em 0 0;vertical-align:middle"${w.enabled ? " checked" : ""}> ${T.workerOn}</label></p><p class="dim">${T.workerHelp}</p>${w.login_available ? `<p><label><input type="checkbox" id="loginOn" style="width:auto;margin:0 .5em 0 0;vertical-align:middle"${w.login ? " checked" : ""}> ${T.loginOn}</label></p><p class="dim">${T.loginHelp}</p>` : ""}` + fieldsHtml(w) + (w.enabled ? `<p class="dim">${T.workerAs}: ${esc(w.machine || "")}${w.last_poll ? `. ${T.workerLast}: ${esc(w.last_poll)}` : ""}${w.last_asset ? `. ${T.workerAsset}: <code>${esc(w.last_asset)}</code>` : ""}</p>` + (w.paused_until ? `<p>${T.workerPaused} ${esc(w.paused_until)}${w.pause_reason ? ": " + esc(w.pause_reason) : ""}. <button class="plain" id="resumeNow">${T.resumeNow}</button></p>` : "") + (w.error ? `<p>${T.workerProblem}: ${esc(w.error)}</p>` : "") : ""))(s.worker || {}),
    models: `<p>${T.speech}: <code>${esc(s.model)}</code></p><p>${T.speakers}: ${{lokaal: T.spLocal, huggingface: T.spHub, uit: T.spOff}[s.speakers]}</p><p class="dim">${T.credit}</p><p class="dim">${T.version} ${esc(s.version)}</p>`,
  };
  for (const id in html) if (drawn["set-" + id] !== html[id] && !$(id).contains(document.activeElement)) { $(id).innerHTML = html[id]; drawn["set-" + id] = html[id]; }
  if (document.activeElement !== $("spoken")) { $("spoken").value = s.spoken; $("spoken").disabled = s.spoken_fixed; }
  $("dot").className = "dot " + (s.account === "gebruiker" || s.account === "token" ? "on" : "off");
  $("who").textContent = T.who[s.account];
}

async function tick() {
  let s;
  try { s = await (await fetch("/state")).json(); } catch { $("who").textContent = T.down; $("dot").className = "dot off"; return; }
  if (s.lang !== lang || !started) { started = true; setLanguage(s.lang); }
  if (!landed) { landed = true; if (s.account === "geen" || s.account === "uitgelogd") document.querySelector('.nav[data-view="settings"]').click(); }
  if (document.activeElement !== $("lang")) $("lang").value = s.app_language;
  summary(s.jobs); settings(s);
  const list = $("list"), seen = new Set();
  if (!s.jobs.length) {
    if (drawn.empty !== true) { list.innerHTML = `<p class="empty">${T.empty}</p>`; drawn.empty = true; }
    return;
  }
  if (drawn.empty) { list.innerHTML = ""; drawn.empty = false; }
  s.jobs.forEach((job, index) => {
    const id = "job-" + job.n, isOpen = open[job.n] ?? job.status === "bezig";
    seen.add(id);
    let el = $(id);
    if (!el) { el = document.createElement("div"); el.className = "job"; el.id = id; }
    if (list.children[index] !== el) list.insertBefore(el, list.children[index] || null);
    const html = row(job, isOpen);
    if (drawn[id] !== html) { el.innerHTML = html; drawn[id] = html; }
    el.querySelector(".el").textContent = job.status === "bezig" ? " " + clock(job.elapsed || 0) : "";
  });
  [...list.children].forEach(el => { if (!seen.has(el.id)) { delete drawn[el.id]; el.remove(); } });
}
tick(); setInterval(tick, 1000);
</script>
</body>
</html>
