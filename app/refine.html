<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refine</title>
<style>
:root {
  --window: #f5f6f7; --surface: #ffffff; --line: #d9dde2; --soft: #eceef1; --head: #fafbfc;
  --text: #1c1f23; --muted: #6a727d; --accent: #1a6fe0; --pick: #eaf2fd;
  --wave: #8f98a3; --wave-off: #c9ced5; --play: #c9412b; --bad: #c9412b; --warm: #a86a00; --video: #0d0f12;
}
@media (prefers-color-scheme: dark) {
  :root {
    --window: #1d2025; --surface: #262a30; --line: #343941; --soft: #2e333a; --head: #2a2e35;
    --text: #e8eaed; --muted: #8d95a0; --accent: #4c9dff; --pick: #1f3350;
    --wave: #7d8692; --wave-off: #464c56; --play: #e5634d; --bad: #e5634d; --warm: #e8a33d; --video: #000;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--window); color: var(--text); display: flex; flex-direction: column; overflow: hidden;
       font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
       font-variant-numeric: tabular-nums; -webkit-user-select: none; user-select: none; cursor: default; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: ui-monospace, Menlo, monospace; }
header { display: flex; align-items: center; gap: 12px; padding: 12px 18px 10px; }
header a { color: var(--accent); text-decoration: none; white-space: nowrap; }
header h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -.015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tag { font-size: 11px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; white-space: nowrap; }
.dim { color: var(--muted); white-space: nowrap; }
.grow { flex: 1; }
#upper { flex: 1; min-height: 0; display: flex; gap: 14px; padding: 0 18px; }
#left { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
#screen { position: relative; flex: 1; min-height: 120px; background: var(--video); border-radius: 8px; overflow: hidden; }
#screen video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
#sub { position: absolute; left: 50%; transform: translateX(-50%); bottom: 22px; max-width: 82%; background: rgba(0,0,0,.72);
       color: #fff; font-size: 18px; line-height: 1.35; padding: 4px 12px; border-radius: 4px; text-align: center; pointer-events: none; }
#src { position: absolute; top: 10px; left: 12px; color: #c4c9d0; font-size: 11px; background: rgba(0,0,0,.55); padding: 2px 7px; border-radius: 4px; }
#busy { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #8d95a0; font-size: 12px; }
.bar { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-width: 0; overflow: hidden; }
.bar > * { flex-shrink: 0; }   /* knoppen en tijden krimpen nooit (anders wordt de ronde afspeelknop ovaal) */
.bar > #keys { flex-shrink: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }   /* de sneltoetsen wijken */
#left > .bar { container-type: inline-size; }   /* zodat de sneltoetsen op de breedte van de balk reageren */
@container (max-width: 700px) { #keys { display: none; } }
@container (max-width: 380px) { #total { display: none; } }   /* heel smal: alleen de lopende tijd */
.icon { width: 32px; height: 32px; border: 0; background: none; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
.icon:hover { background: var(--soft); }
#play { width: 36px; height: 36px; background: var(--accent); color: #fff; border-radius: 50%; }
#play:hover { filter: brightness(1.08); }
#play.off { opacity: .35; filter: none; cursor: default; }
#right { width: clamp(280px, 47%, 440px); flex: none; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
#speakers { padding: 8px 10px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: var(--head); }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; background: var(--surface); }
.sw { width: 10px; height: 10px; border-radius: 2px; flex: none; display: inline-block; }
#count { padding: 6px 10px; border-bottom: 1px solid var(--line); color: var(--muted); display: flex; gap: 10px; }
#list { flex: 1; overflow-y: auto; }
.blk { display: grid; grid-template-columns: 30px 1fr; gap: 1px 8px; padding: 7px 10px 8px; border-bottom: 1px solid var(--soft); box-shadow: inset 3px 0 0 transparent; }
.blk.pick { background: var(--pick); box-shadow: inset 3px 0 0 var(--accent); }
.blk.now .txt { font-weight: 550; }
.blk .nr { color: var(--muted); font-size: 11px; padding-top: 1px; }
.blk .meta { display: flex; flex-wrap: wrap; gap: 0 8px; align-items: baseline; font-size: 11px; color: var(--muted); min-width: 0; }
.blk .who { display: inline-flex; align-items: center; gap: 4px; color: var(--text); }
.blk .txt { grid-column: 2; font-size: 13.5px; line-height: 1.4; -webkit-user-select: text; user-select: text; }
.low { text-decoration: underline wavy color-mix(in srgb, var(--bad) 70%, transparent); text-underline-offset: 3px; }
#lower { flex: none; margin: 12px 18px 0; background: var(--surface); border: 1px solid var(--line); border-bottom: 0; border-radius: 8px 8px 0 0; display: flex; flex-direction: column; }
#tools { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-bottom: 1px solid var(--line); container-type: inline-size; overflow: hidden; }
#tools input[type=range] { width: 140px; }
/* Smal venster: de knoppen blijven, de rest wijkt (eerst de lettertjes en "Zoom", dan "Je hoort:"); wat je hoort en de
   stand van de golfvormen krijgen een beletselteken en staan volledig in de tooltip. */
#tools > * { flex-shrink: 0; }
#tools > .grow { flex: 1 1 0; min-width: 0; }
#tools > #hear, #tools > #wavesState { flex-shrink: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#tools > #hear { min-width: 60px; }
@container (max-width: 1000px) { #tools kbd, #zoomLabel { display: none; } }
@container (max-width: 820px) { #hearLabel, #toolSep { display: none; } #tools input[type=range] { width: 90px; } }
#tools .btn { padding: 3px 10px; } #tools .btn kbd { font: 11px ui-monospace, Menlo, monospace; color: var(--muted); margin-left: 4px; }
#tl { display: grid; grid-template-columns: 210px 1fr; }
#labels { border-right: 1px solid var(--line); font-size: 11px; color: var(--muted); }
#labels > div { border-bottom: 1px solid var(--soft); padding: 0 6px 0 10px; display: flex; align-items: center; gap: 8px; }
.lane-name { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.lane-name b { color: var(--text); font-weight: 600; white-space: nowrap; }
.lane-name span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lane-name span.used { color: var(--good, #2e9a48); }
.listen { width: 26px; height: 26px; flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 5px; display: flex; align-items: center; justify-content: center; }
.listen[hidden] { display: flex; visibility: hidden; }
.listen[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
#canvasBox { position: relative; overflow: hidden; }
#canvas { display: block; width: 100%; cursor: text; }
footer { display: flex; gap: 18px; align-items: center; padding: 6px 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
#error { margin: 0 18px 10px; background: color-mix(in srgb, var(--bad) 14%, transparent); border-left: 3px solid var(--bad); padding: 8px 10px; border-radius: 4px; -webkit-user-select: text; user-select: text; }
.txt[contenteditable] { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; background: var(--surface); cursor: text; }
.btn { padding: 4px 11px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; }
.btn:disabled { opacity: .45; }
.btn.danger { color: var(--bad); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 550; }
.ok { color: var(--good, #2e9a48); }
.chip { cursor: text; }
.chip input { all: unset; width: 120px; }
.addsp { border: 1px dashed var(--line); background: none; color: var(--accent); border-radius: 6px; padding: 2px 9px; }
#menu { position: fixed; z-index: 20; min-width: 240px; max-width: 320px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
        box-shadow: 0 10px 28px rgba(0,0,0,.25); padding: 5px; font-size: 13px; }
#menu .h { padding: 4px 9px 6px; color: var(--muted); font-size: 11px; }
#menu button { all: unset; box-sizing: border-box; width: 100%; display: flex; align-items: center; gap: 8px; padding: 6px 9px; border-radius: 5px; }
#menu button:hover, #menu button:focus { background: var(--accent); color: #fff; }
#menu .cur { color: var(--muted); font-size: 11px; margin-left: auto; }
#menu button:hover .cur, #menu button:focus .cur { color: #fff; }
#menu hr { border: 0; height: 1px; background: var(--soft); margin: 5px 0; }
#sub { white-space: pre-line; }
/* Een ondertitel staat in beeld in precies zijn eigen regels: niet verder afbreken, de letter krimpt met het beeld mee. */
#screen { container-type: inline-size; }
#sub.lines { white-space: pre; max-width: 96%; font-size: clamp(10px, 3.6cqw, 18px); }
/* De titel blijft leesbaar; een lange melding ernaast krijgt hooguit twee regels en de rest staat in de tooltip. */
header h1 { flex: 0 1 auto; max-width: 45%; min-width: 150px; }   /* krimpt met een beletselteken, de knoppen niet */
header > :not(h1):not(#status):not(.grow) { flex-shrink: 0; }
#status { flex: 1 1 0; min-width: 0; white-space: normal; overflow: hidden; line-height: 1.3;
          display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
#status + .grow { display: none; }
/* Te weinig ruimte naast de titel: de melding als eigen regel eronder, één regel, de rest in de tooltip. */
header { flex-wrap: wrap; row-gap: 2px; }
#status.below { order: 99; flex: 1 0 100%; -webkit-line-clamp: 1; padding-left: 2px; }
#status.below + .grow { display: block; }
.bad { color: var(--bad); }
.warm { color: var(--warm); }
.blk.warn1 { background: color-mix(in srgb, var(--warm) 13%, transparent); }
.blk.warn2 { background: color-mix(in srgb, var(--bad) 12%, transparent); }
.blk.warn1.pick { background: color-mix(in srgb, var(--warm) 13%, var(--pick)); }
.blk.warn2.pick { background: color-mix(in srgb, var(--bad) 12%, var(--pick)); }
#modebar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 7px 10px; border-bottom: 1px solid var(--line); background: var(--head); }   /* smal paneel: de knoppen rechts gaan naar een tweede regel */
#modebar .btn { padding: 2px 9px; font-size: 12px; flex: none; }
.seg { display: inline-flex; flex: none; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--surface); }
.seg button { all: unset; padding: 3px 12px; font-size: 12.5px; white-space: nowrap; }
.seg button[aria-selected="true"], .seg button.on { background: var(--accent); color: #fff; font-weight: 550; }
.seg #subMore { padding: 3px 9px; border-left: 1px solid color-mix(in srgb, #fff 35%, var(--accent)); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
#subAdd { flex: none; border: 1px dashed var(--line); background: none; color: var(--accent); border-radius: 7px; padding: 3px 12px; font-size: 12.5px; }
#count .dot { width: 9px; height: 9px; border-radius: 2px; display: inline-block; margin-right: 5px; }
#count button { all: unset; color: var(--accent); margin-left: auto; }
#count button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#rules { padding: 8px 10px 9px; border-bottom: 1px solid var(--line); font-size: 12px; }
#rules .foot { margin-top: 8px; color: var(--muted); font-size: 11px; line-height: 1.35; white-space: normal; }
#setForm .sect, #makeBox .sect { font-size: 11px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 2px 0 6px; }
#setForm .row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
#setForm select { font: inherit; flex: 1; min-width: 0; }
#setForm .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 16px; margin-bottom: 10px; }
#setForm .grid label { display: flex; align-items: center; gap: 6px; min-width: 0; }
#setForm .grid label > span:first-child { flex: 1; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#setForm .unit { width: 40px; flex: none; color: var(--muted); font-size: 11px; }
#setForm input[type=number] { width: 52px; flex: none; font: inherit; font-size: 12px; color: var(--text); background: var(--window); border: 1px solid var(--line); border-radius: 5px;
             padding: 1px 4px; text-align: right; -webkit-user-select: text; user-select: text; }
#setForm .opt { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 7px; }
#setForm .opt input[type=checkbox] { margin: 3px 0 0; flex: none; }
#setForm .opt .what { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#rules #setForm .opt small { display: none; }   /* onder Instellingen compact: de uitleg staat in het maakvenster en in de tooltip */
#setForm input:disabled { opacity: .45; }
#setForm .opt small { color: var(--muted); font-size: 11px; line-height: 1.35; }
#setForm .opt .amt { flex: none; display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 11px; white-space: nowrap; }
#makeBack { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.45); display: flex; align-items: flex-start; justify-content: center; padding-top: 6vh; overflow-y: auto; }
#makeBox { width: 520px; max-width: calc(100vw - 32px); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 24px 60px rgba(0,0,0,.45);
           padding: 18px 20px 16px; font-size: 13px; margin-bottom: 24px; }
#makeBox h2 { margin: 0; font-size: 16px; font-weight: 650; }
#makeBox p { margin: 4px 0 14px; color: var(--muted); }
#makeBox hr { border: 0; height: 1px; background: var(--soft); margin: 12px 0; }
#makeBox .srow { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 7px; }
#makeBox .srow > span:first-child { width: 90px; flex: none; }
#makeBox .srow label { display: inline-flex; align-items: center; gap: 6px; margin-right: 12px; }
#makeBox .srow .col { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
#makeBox .srow .col label { margin: 0; }
#makeBox .srow small { color: var(--muted); font-size: 11px; }
#makeBox.load #setFitHead, #makeBox.load #setForm .opt, #makeBox.load #mkNewOnly { display: none; }
#makeBox #mkLoadNote { margin: 10px 0 12px; font-size: 12px; }
#mkCount { background: var(--window); border: 1px solid var(--soft); border-radius: 8px; padding: 8px 12px; display: flex; align-items: center; gap: 14px; margin: 12px 0; min-height: 20px; }
#mkCount .dot { width: 9px; height: 9px; border-radius: 2px; display: inline-block; margin-right: 5px; }
#mkCount .last { margin-left: auto; color: var(--muted); font-size: 12px; }
#makeBox .end { display: flex; justify-content: flex-end; gap: 8px; }
#makeBox .end .btn { padding: 6px 14px; }
#subMenu { position: fixed; z-index: 20; min-width: 250px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
        box-shadow: 0 10px 28px rgba(0,0,0,.25); padding: 5px; font-size: 13px; }
#subMenu button { all: unset; box-sizing: border-box; width: 100%; padding: 6px 9px; border-radius: 5px; }
#subMenu button:hover, #subMenu button:focus { background: var(--accent); color: #fff; }
#subMenu button.danger { color: var(--bad); }
#subMenu button.danger:hover, #subMenu button.danger:focus { background: var(--bad); color: #fff; }
#subMenu hr { border: 0; height: 1px; background: var(--soft); margin: 5px 0; }
.lane-pick { cursor: default; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <a href="/" id="back"></a>
  <h1 id="title"></h1>
  <span class="tag">Refine</span>
  <span class="dim" id="status"></span>
  <span class="grow"></span>
  <button class="icon" id="undo" disabled><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 4 2.5 7.5 6 11M3 7.5h6.5a4 4 0 0 1 0 8H8"/></svg></button>
  <button class="icon" id="redo" disabled><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M10 4l3.5 3.5L10 11M13 7.5H6.5a4 4 0 0 0 0 8H8"/></svg></button>
  <button class="btn primary" id="writeBtn" hidden></button>
  <button class="btn danger" id="discard" hidden></button>
  <button class="btn" id="restore" hidden></button>
  <button class="btn primary" id="save" disabled></button>
</header>
<div id="makeBack" hidden>
  <div id="makeBox" role="dialog" aria-modal="true" aria-labelledby="mkTitle">
    <h2 id="mkTitle"></h2>
    <p id="mkIntro"></p>
    <div class="srow" id="mkHowRow"><span id="mkHowLabel"></span><span class="col">
      <label><input type="radio" name="mkHow" value="new"> <span id="mkNew"></span></label>
      <span class="col" id="mkLoadList"></span>
      <label><input type="radio" name="mkHow" value="pick"> <span id="mkPick"></span></label></span></div>
    <hr>
    <div id="mkForm"></div>
    <div id="mkNewOnly">
    <hr>
    <div class="sect" id="mkSaveHead"></div>
    <div class="srow"><span id="mkFileLabel"></span><span>
      <label><input type="radio" name="mkFmt" value="srt"> .srt</label>
      <label><input type="radio" name="mkFmt" value="vtt"> .vtt</label>
      <label><input type="radio" name="mkFmt" value="both"> <span id="mkBoth"></span></label></span></div>
    <div class="srow"><span id="mkPlaceLabel"></span><span class="col">
      <label><input type="radio" name="mkPlace" value="media"> <span id="mkMedia"></span> <small id="mkMediaName"></small></label>
      <label><input type="radio" name="mkPlace" value="other"> <span id="mkOther"></span></label></span></div>
    <div id="mkCount" aria-live="polite"></div>
    </div>
    <p id="mkLoadNote" hidden></p>
    <div class="end"><button class="btn" id="mkCancel"></button><button class="btn primary" id="mkGo"></button></div>
  </div>
</div>
<div id="subMenu" role="menu" hidden></div>
<div id="error" hidden></div>
<div id="upper">
  <section id="left">
    <div id="screen">
      <video id="video" playsinline></video>
      <div id="busy"></div>
      <div id="src" hidden></div>
      <div id="sub" hidden></div>
    </div>
    <div class="bar">
      <button class="icon" id="prev" aria-label=""><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 3v10M13 3 6 8l7 5z"/></svg></button>
      <button class="icon" id="play" aria-label=""><svg id="playIcon" width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 2.5v11l9.5-5.5z"/></svg></button>
      <button class="icon" id="next" aria-label=""><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 3v10M3 3l7 5-7 5z"/></svg></button>
      <span class="mono" id="tc" style="margin-left: 6px">00:00:00:00</span>
      <span class="dim mono" id="total"></span>
      <span class="grow"></span>
      <span class="dim" id="keys"></span>
    </div>
  </section>
  <section id="right">
    <div id="modebar">
      <div class="seg" role="tablist"><button id="modeT" role="tab" data-mode="transcript"></button><button id="modeS" role="tab" data-mode="subtitles" hidden></button><button id="subMore" aria-haspopup="menu" hidden>⋯</button></div>
      <button id="subAdd"></button>
      <span class="grow"></span>
      <button class="btn" id="rulesBtn" aria-expanded="false" hidden></button>
      <button class="btn" id="fitBtn" hidden></button>
    </div>
    <div id="rules" hidden>
      <div id="setForm">
        <div class="sect" id="setRulesHead"></div>
        <div class="row"><select id="exPreset" aria-label=""></select></div>
        <div class="grid">
          <label><span id="exL_max_chars"></span><input type="number" id="ex_max_chars"><span class="unit"></span></label>
          <label><span id="exL_max_lines"></span><input type="number" id="ex_max_lines"><span class="unit"></span></label>
          <label><span id="exL_min_ms"></span><input type="number" id="ex_min_ms" step="0.1"><span class="unit" id="exU_min_ms"></span></label>
          <label><span id="exL_max_ms"></span><input type="number" id="ex_max_ms" step="0.5"><span class="unit" id="exU_max_ms"></span></label>
          <label><span id="exL_gap_ms"></span><input type="number" id="ex_gap_ms" step="10"><span class="unit">ms</span></label>
          <label><span id="exL_cps"></span><input type="number" id="ex_cps"><span class="unit" id="exU_cps"></span></label>
        </div>
        <div class="sect" id="setFitHead"></div>
        <div class="opt"><input type="checkbox" id="ex_linger" aria-labelledby="exL_linger"><span class="what"><span id="exL_linger"></span><small id="exH_linger"></small></span>
          <span class="amt"><span id="exP_linger"></span><input type="number" id="ex_linger_ms" step="0.5" aria-labelledby="exL_linger exP_linger"><span id="exU_linger_ms"></span></span></div>
        <div class="opt"><input type="checkbox" id="ex_merge" aria-labelledby="exL_merge"><span class="what"><span id="exL_merge"></span><small id="exH_merge"></small></span>

// --- regelbreuk en waarschuwingen van een ondertitel: dezelfde keuzes als app/subtitles.py (layout, report) ---
const SENT_END = /[.!?…]["'”’»)\]]*$/, CLAUSE_END = /[,;:]["'”’»)\]]*$/;
const WEAK = new Set(["de", "het", "een", "en", "of", "van", "in", "op", "te", "met", "voor", "naar", "om", "dat", "die",
  "the", "a", "an", "and", "or", "to", "on", "at", "for", "with", "that"]);
function greedy(texts, width) {
  const lines = []; let line = "";
  for (const text of texts) {
    if (line && line.length + 1 + text.length > width) { lines.push(line); line = text; }
    else line = line ? line + " " + text : text;
  }

}
function layoutLines(texts, rules) {
  const width = rules.max_chars, most = rules.max_lines, whole = texts.join(" ");

  if (most === 2) {

    for (let i = 1; i < texts.length; i++) {
      const first = texts.slice(0, i).join(" "), second = texts.slice(i).join(" ");
      if (first.length > width || second.length > width) continue;
      const last = texts[i - 1];
      let score = Math.abs(first.length - second.length);
      if (SENT_END.test(last) || CLAUSE_END.test(last)) score -= 12;
      if (WEAK.has(last.toLowerCase().replace(/^["'“‘«(]+|["'“‘«(]+$/g, ""))) score += 16;
      if (!best || score < best[0]) best = [score, [first, second]];
    }
    if (best) return best[1];
  }
  for (let narrow = Math.max(1, Math.ceil(whole.length / most)); narrow <= width; narrow++) {
    const lines = greedy(texts, narrow);
    if (lines.length <= most) return lines;

}
// Niveau 1 (oranje): sneller dan de leessnelheid, te kort of te lang. Niveau 2 (rood): niet te lezen, past niet
// binnen de regels of loopt over de volgende heen. Zelfde keuzes als subtitles.warnings.
function check(b, nextB) {
  const texts = b.display.split(" ").filter(Boolean), lines = layoutLines(texts, R);
  const chars = lines.reduce((n, l) => n + l.length, 0) + lines.length - 1, d = Math.max(b.end - b.start, 0.001);
  const warn = [], cps = chars / d;
  if (cps > R.cps * 1.5) warn.push("unreadable"); else if (cps > R.cps) warn.push("fast");
  if (lines.length > R.max_lines || lines.some(l => l.length > R.max_chars)) warn.push("wide");
  if (d * 1000 < R.min_ms - 1) warn.push("short");

}

}

}
async function kick() {

  try { await loop(); } catch (e) { console.log("speler: " + e); }

async function loadChunk(my) {

  const s = speakers.find(x => x.id === chip.dataset.sp), nm = chip.querySelector(".nm");
  const input = document.createElement("input"); input.value = s.name; nm.replaceWith(input); input.focus(); input.select();
  let done = false;
  const finish = ok => {
    if (done) return; done = true;
    const name = input.value.trim();

    else renderSpeakers();

});

// woorden bewerken: dubbelklik op de tekst. Enter splitst op de cursor, Backspace aan het begin voegt samen met
// het vorige blok, Delete aan het eind met het volgende; ⌘Enter of ergens anders klikken bewaart, Esc annuleert.
const tokens = t => t.replace(/\s+/g, " ").trim() ? t.replace(/\s+/g, " ").trim().split(" ") : [];
function caretIn(el) {
  const sel = window.getSelection(); if (!sel.rangeCount) return {at: 0, collapsed: true};
  const r = sel.getRangeAt(0), pre = document.createRange(); pre.selectNodeContents(el); pre.setEnd(r.startContainer, r.startOffset);
  return {at: pre.toString().length, collapsed: r.collapsed};
}
function placeCaret(el, at) {

  if (node) range.setStart(node, Math.min(at, node.textContent.length)); else range.setStart(el, 0);
  range.collapse(true); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
}
function startEdit(i, caret) {
  const el = $("b" + i)?.querySelector(".txt"); if (!el || el.isContentEditable) return;
  pick(i, false);

  el.textContent = b.display;
  el.setAttribute("contenteditable", "plaintext-only"); el.title = T.editHint;
  el.spellcheck = true; el.lang = D.transcript.language || "";   // spelling in de taal van het transcript
  el.focus();
  placeCaret(el, caret ?? b.display.length);
  let done = false;
  const text = () => el.textContent.replace(/\s+/g, " ").trim();
  // De bewerkte tekst over de woorden leggen (zonder eigen ongedaan-stap: de aanroeper doet change()).
  const apply = () => { if (text() !== b.display) { b.words = retime(b, text()); b.text = ""; } };
  const finish = ok => {
    if (done) return; done = true;
    if (b.fresh) {                          // een nieuw blok: de tekst hoort bij dezelfde ongedaan-stap
      delete b.fresh;
      if (ok && text()) { b.words = retime(b, text()); updated(true, b); }
      else { restore(history.pop()); edits = Math.max(0, edits - 1); updated(true); }

    const c = caretIn(el), full = el.textContent;

      ev.preventDefault();

      if (!before.length || !after.length) return;           // aan de rand: niets te splitsen
      done = true;

      change(() => {
        b.words = retime(b, before.concat(after).join(" ")); b.text = "";
        const k = before.length, rest = b.words.splice(k);
        second = {start: rest[0].start, end: b.end, speaker: b.speaker, text: "", words: rest};
        b.end = b.words[b.words.length - 1].end;
        blocks.splice(blocks.indexOf(b) + 1, 0, second);
      }, () => second);
      startEdit(blocks.indexOf(second), 0);
      return;
    }
    if (ev.key === "Backspace" && c.collapsed && c.at === 0 && i > 0) {
      ev.preventDefault(); done = true;
      const prev = blocks[i - 1], joinAt = prev.display.length + 1;
      change(() => {
        apply();
        prev.words = prev.words.concat(b.words); prev.text = ""; prev.end = Math.max(prev.end, b.end);
        blocks.splice(blocks.indexOf(b), 1);

    }

      ev.preventDefault(); done = true;
      const nextB = blocks[i + 1], joinAt = text().length;
      change(() => {
        apply();
        b.words = b.words.concat(nextB.words); b.text = ""; b.end = Math.max(b.end, nextB.end);
        blocks.splice(blocks.indexOf(nextB), 1);
      }, b);

    }
  };
  // Writing Tools, het rechtsklikmenu of een ander venster nemen de focus even over: dan blijft het veld open.
  // Pas als de focus binnen het venster ergens anders heen gaat, is het bewerken klaar.
  el.onblur = () => setTimeout(() => {

}
$("list").addEventListener("dblclick", e => { const el = e.target.closest(".blk"); if (el && !e.target.closest("[contenteditable]")) startEdit(+el.dataset.i); });

// Nieuwe tekst over de oude woorden leggen: gelijke woorden houden hun tijd en zekerheid, wat veranderd of
// nieuw is krijgt de tijd van wat het vervangt (of het gat ertussen) en zekerheid 1: nagekeken door een mens.
function retime(b, text) {
  const old = b.words, toks = text ? text.split(" ") : [];
  if (!old.length) {
    const step = (b.end - b.start) / Math.max(toks.length, 1);
    return toks.map((t, k) => ({text: t, start: b.start + k * step, end: b.start + (k + 1) * step, score: 1}));
  }
  const n = old.length, m = toks.length, L = Array.from({length: n + 1}, () => new Int32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    L[i][j] = old[i].text === toks[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  // Standaard vergelijking (langste gemeenschappelijke reeks), daarna de stukken ertussen invullen.
  const ops = []; let i = 0, j = 0;
  while (i < n && j < m) {
    if (old[i].text === toks[j]) { ops.push("="); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) { ops.push("-"); i++; }
    else { ops.push("+"); j++; }
  }
  while (i < n) { ops.push("-"); i++; }
  while (j < m) { ops.push("+"); j++; }
  const out = []; i = 0; j = 0;
  let i0 = 0, j0 = 0, inRun = false;
  const flush = () => {                     // oude woorden i0..i vervangen door nieuwe j0..j
    if (!inRun) return; inRun = false;
    if (j <= j0) return;
    const from = i > i0 ? old[i0].start : (i0 > 0 ? old[i0 - 1].end : b.start);
    const to = i > i0 ? old[i - 1].end : (i0 < n ? old[i0].start : b.end);
    const step = Math.max(to - from, 0) / (j - j0);
    for (let k = j0; k < j; k++) out.push({text: toks[k], start: from + (k - j0) * step, end: from + (k - j0 + 1) * step, score: 1});
  };
  for (const op of ops) {
    if (op === "=") { flush(); out.push(Object.assign({}, old[i])); i++; j++; continue; }
    if (!inRun) { inRun = true; i0 = i; j0 = j; }
    if (op === "-") i++; else j++;
  }
  flush();
  return out;
}

// sprekers wisselen: rechtsklik op geselecteerde woorden of op een blok
function selectedWords(i) {
  const sel = window.getSelection(), el = $("b" + i)?.querySelector(".txt");
  if (!el || !sel.rangeCount || sel.isCollapsed) return null;
  const range = sel.getRangeAt(0), hit = [...el.querySelectorAll(".w")].filter(w => range.intersectsNode(w)).map(w => +w.dataset.w);
  return hit.length ? [Math.min(...hit), Math.max(...hit)] : null;
}
function assign(i, from, to, speaker) {
  change(() => {
    const b = blocks[i], last = b.words.length - 1;
    if (speaker === b.speaker) return false;     // al van deze spreker: niets splitsen
    if (speaker === "new") speaker = newSpeaker();
    if (from === null || (from <= 0 && to >= last)) { if (b.speaker === speaker) return false; b.speaker = speaker; return; }
    // Splitsen op de woordgrenzen: ervoor en erna houden de oude spreker, de selectie krijgt de nieuwe.
    const part = (ws, sp) => ({start: ws[0].start, end: ws[ws.length - 1].end, speaker: sp, text: "", words: ws});
    const pieces = [];
    if (from > 0) pieces.push(part(b.words.slice(0, from), b.speaker));
    const mid = part(b.words.slice(from, to + 1), speaker); pieces.push(mid);
    if (to < last) pieces.push(part(b.words.slice(to + 1), b.speaker));
    pieces[0].start = Math.min(pieces[0].start, b.start); pieces[pieces.length - 1].end = Math.max(pieces[pieces.length - 1].end, b.end);
    blocks.splice(i, 1, ...pieces);
    assign.keep = mid;
  }, () => assign.keep);
}
function openMenu(x, y, i, range) {
  const b = blocks[i], cur = speakerOf[b.speaker]?.name || b.speaker, menu = $("menu");
  const head = range ? T.selected(range[1] - range[0] + 1, esc(cur)) : T.wholeBlock(esc(cur));
  menu.innerHTML = `<div class="h">${head}</div><div class="h" style="font-weight:600;padding-top:0">${T.assignTo}</div>`
    + speakers.map(s => `<button data-to="${esc(s.id)}"><i class="sw" style="background:${speakerOf[s.id].color}"></i>${esc(s.name)}${s.id === b.speaker ? `<span class="cur">${T.current}</span>` : ""}</button>`).join("")
    + (mode === "transcript" ? `<button data-to="new"><i class="sw" style="border:1px dashed var(--muted)"></i>${T.newSpeaker}</button>` : "") + "<hr>"
    + `<button data-act="edit">${T.editText}</button><button data-act="delete">${T.deleteBlock}</button>`;
  menu.hidden = false;
  const w = menu.offsetWidth, h = menu.offsetHeight;
  menu.style.left = Math.min(x, innerWidth - w - 8) + "px"; menu.style.top = Math.min(y, innerHeight - h - 8) + "px";
  menu.onclick = e => {
    const btn = e.target.closest("button"); if (!btn) return;
    closeMenu();
    if (btn.dataset.to) { assign.keep = null; assign(i, range ? range[0] : null, range ? range[1] : null, btn.dataset.to); }
    else if (btn.dataset.act === "edit") startEdit(i);
    else if (btn.dataset.act === "delete") change(() => { blocks.splice(i, 1); });
  };

}

document.addEventListener("mousedown", e => { if (!e.target.closest("#menu")) closeMenu(); });

// macOS selecteert bij een rechtsklik het woord onder de muis; de selectie daarom vastleggen vóór dat gebeurt.
let ctxRange = null;
$("list").addEventListener("mousedown", e => {
  const el = e.target.closest(".blk");
  if (e.button !== 2 || !el || e.target.closest("[contenteditable]")) return;
  ctxRange = selectedWords(+el.dataset.i); e.preventDefault();
});
$("list").addEventListener("contextmenu", e => {
  const el = e.target.closest(".blk"); if (!el || e.target.closest("[contenteditable]")) return;
  e.preventDefault(); const i = +el.dataset.i;
  openMenu(e.clientX, e.clientY, i, ctxRange); ctxRange = null;
});

  const r = cv.getBoundingClientRect(), tops = laneTops(), y = e.clientY - r.top;
  const i = blockAt(viewStart + (e.clientX - r.left) / r.width * span), [top, bottom] = activeLane();
  if (i < 0 || y < top || y >= bottom) return;
  e.preventDefault(); pick(i, false); openMenu(e.clientX, e.clientY, i, null);   // op de tijdlijn alleen hele blokken

// --- montage op de tijdlijn: splitsen bij de afspeelkop, samenvoegen, nieuw blok, randen verslepen ---
function flash(text) { $("status").textContent = text; }
function splitAtPlayhead() {
  const t = now(), i = blockAt(t); if (i < 0) return flash(T.noSplit);
  const b = blocks[i], k = b.words.findIndex(w => w.start >= t - 0.02);
  if (k <= 0) return flash(T.noSplit);
  let second = null;
  change(() => {
    const rest = b.words.splice(k);
    second = {start: rest[0].start, end: b.end, speaker: b.speaker, text: "", words: rest};
    b.end = b.words[b.words.length - 1].end; b.text = "";
    blocks.splice(blocks.indexOf(b) + 1, 0, second);
  }, () => second);
}
function mergeNext() {
  const i = picked >= 0 ? picked : blockAt(now());
  if (i < 0 || i >= blocks.length - 1) return flash(T.noMerge);
  const a = blocks[i], c = blocks[i + 1];
  change(() => { a.words = a.words.concat(c.words); a.text = ""; a.end = Math.max(a.end, c.end); blocks.splice(blocks.indexOf(c), 1); }, a);
}
function newBlock() {
  const t = now(); if (blockAt(t) >= 0) return flash(T.noNew);
  const nextB = blocks.find(b => b.start > t), prevB = [...blocks].reverse().find(b => b.end <= t);
  const end = Math.min(t + 2, nextB ? nextB.start - 0.05 : dur);
  if (end - t < 0.3) return flash(T.noNew);
  const fresh = {start: t, end, speaker: (prevB || nextB || {speaker: speakers[0]?.id || "1"}).speaker, text: "", words: [], fresh: true};
  change(() => { blocks.push(fresh); }, fresh);
  startEdit(blocks.indexOf(fresh), 0);
}
$("splitBtn").onclick = splitAtPlayhead; $("mergeBtn").onclick = mergeNext; $("newBtn").onclick = newBlock;
// De melding in de kop: naast de titel als hij daar op één regel past (een lange melding: als er minstens STATUS_WIDE
// pixels zijn, dan in twee regels), anders als eigen regel eronder. Nooit in stukjes naast de titel.
const STATUS_WIDE = 320;
const measure = document.createElement("canvas").getContext("2d");
function fitStatus() {
  const h = document.querySelector("header"), st = $("status"), cs = getComputedStyle(h);
  const others = [...h.children].filter(c => c !== st && c.offsetParent && !c.classList.contains("grow"));
  const free = h.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight)
    - others.reduce((w, c) => w + c.offsetWidth, 0) - parseFloat(cs.columnGap) * others.length;
  const fs = getComputedStyle(st);   // (font als geheel is leeg bij line-clamp: de delen apart)
  measure.font = `${fs.fontStyle} ${fs.fontWeight} ${fs.fontSize} ${fs.fontFamily}`;
  const need = Math.min(Math.ceil(measure.measureText(st.textContent.trim()).width) + 4, STATUS_WIDE);
  const below = free < need && st.textContent.trim() !== "";
  if (st.classList.contains("below") !== below) st.classList.toggle("below", below);
  st.title = st.textContent;
}
new ResizeObserver(fitStatus).observe(document.querySelector("header"));
new MutationObserver(fitStatus).observe(document.querySelector("header"),
  {subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ["hidden"]});
// Wat in een smal venster een beletselteken krijgt, staat volledig in de tooltip.
for (const id of ["hear", "wavesState"]) {
  const el = $(id);
  new MutationObserver(() => { el.title = el.textContent; }).observe(el, {childList: true, characterData: true, subtree: true});
}

// Randen verslepen: binnen het buurblok, minstens 0,2 s lang. Eén ongedaan-stap per keer slepen.
let drag = null, suppressClick = false;
const EDGE = 6;
function edgeAt(x, y) {
  const [top, bottom] = activeLane(), w = cv.clientWidth;
  if (y < top || y >= bottom) return null;
  let best = null;
  blocks.forEach((b, i) => {
    if (b.end < viewStart || b.start > viewStart + span) return;
    for (const side of ["start", "end"]) {
      const d = Math.abs(xOf(b[side], w) - x);
      if (d <= EDGE && (!best || d < best.d)) best = {i, side, d};
    }
  });
  return best;
}
cv.addEventListener("mousemove", e => {
  if (drag) return;
  const r = cv.getBoundingClientRect();
  cv.style.cursor = edgeAt(e.clientX - r.left, e.clientY - r.top) ? "ew-resize" : "text";
});
cv.addEventListener("mousedown", e => {
  if (e.button !== 0) return;
  const r = cv.getBoundingClientRect(), hit = edgeAt(e.clientX - r.left, e.clientY - r.top);
  if (!hit) return;
  e.preventDefault();
  drag = Object.assign(hit, {block: blocks[hit.i], before: snapshot(), moved: false});
  pick(hit.i, false);
});
window.addEventListener("mousemove", e => {
  if (!drag) return;
  const r = cv.getBoundingClientRect(), b = drag.block, i = blocks.indexOf(b);
  const t = viewStart + Math.max(0, Math.min(e.clientX - r.left, r.width)) / r.width * span;
  if (drag.side === "start") b.start = Math.max(i > 0 ? blocks[i - 1].end : 0, Math.min(t, b.end - 0.2));
  else b.end = Math.min(i < blocks.length - 1 ? blocks[i + 1].start : dur, Math.max(t, b.start + 0.2));
  drag.moved = true; draw();
});
window.addEventListener("mouseup", () => {
  if (!drag) return;
  const d = drag; drag = null; suppressClick = true; setTimeout(() => suppressClick = false, 0);
  if (!d.moved) return;
  const b = d.block;
  // Woorden binnen het blok houden: Iconik rekent woordtijden vanaf het begin van het blok.
  b.words.forEach(w => { w.start = Math.min(Math.max(w.start, b.start), b.end); w.end = Math.min(Math.max(w.end, w.start), b.end); });
  history.push(d.before); if (history.length > 300) history.shift();
  future = []; edits++; updated(true, b);
});

// --- start ---
async function start() {
  try { D = await (await fetch(`/refine/view?${REF}`)).json(); }
  catch (e) { showError(String(e)); return; }
  lang = D.lang === "nl" ? "nl" : "en"; T = TEXT[lang]; document.documentElement.lang = lang;
  $("back").textContent = T.back; $("keys").textContent = T.keys; $("keys").parentElement.title = T.keys;
  $("undo").title = T.undo; $("undo").setAttribute("aria-label", T.undo); $("redo").title = T.redo; $("redo").setAttribute("aria-label", T.redo);
  $("prev").setAttribute("aria-label", T.prev); $("next").setAttribute("aria-label", T.next);
  $("splitBtn").innerHTML = `${T.split}<kbd>S</kbd>`; $("mergeBtn").innerHTML = `${T.merge}<kbd>M</kbd>`; $("newBtn").innerHTML = `${T.newBlock}<kbd>N</kbd>`;
  $("splitBtn").title = `${T.split} (S)`; $("mergeBtn").title = `${T.merge} (M)`; $("newBtn").title = `${T.newBlock} (N)`;
  $("hearLabel").textContent = T.hear; $("zoomLabel").textContent = T.zoom; $("note").textContent = T.note;
  if (D.error) { $("title").textContent = ITEM || QUERY.get("asset") || ""; showError(D.error); return; }
  document.title = D.title + " · Refine"; $("title").textContent = D.title;
  fps = D.fps || 25; dur = D.duration || 0;
  const tr = D.transcript;
  fromDict(D.draft ? D.draft.transcript : tr);
  if (D.draft) { edits = D.draft.edits || 0; savedAt = D.draft.saved_at; }
  // Ondertitels zijn er alleen als iemand ze voor dit asset heeft gemaakt.
  R = D.export.rules;
  if (D.subtitles) takeSubs(D.subtitles);
  rulesSetup();
  updated(false);
  if (D.draft) $("status").textContent = T.draftFrom(D.draft.saved_at.replace("T", " ").slice(0, 16)) + " · " + T.changes(edits);
  $("total").textContent = "/ " + tc(dur);
  const engine = [tr.engine.model, tr.engine.version ? "mlx-whisper " + tr.engine.version : ""].filter(Boolean).join(", ") || "Local Transcribe";
  $("source").textContent = T.source(engine, T.from[D.origin] || D.origin);
  $("src").textContent = (D.offline ? T.originOff : T.origin)(D.media_name); $("src").hidden = false;
  if (D.offline) { $("play").classList.add("off"); $("play").title = T.offline; }
  $("busy").textContent = D.offline ? T.offline : D.video ? T.video : T.noVideo;
  renderList(); renderLabels(); readColors(); playIcon();
  $("zoom").value = 600; setZoom(); sizeCanvas();
  new ResizeObserver(sizeCanvas).observe($("canvasBox"));
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readColors(); draw(); });
  if (D.offline) seek(blocks.length ? blocks[0].start : 0); else startPlayer(blocks.length ? blocks[0].start : 0);
  loadWaves();
  requestAnimationFrame(frame);
  new MutationObserver(() => { $("status").title = $("status").textContent; }).observe($("status"), {childList: true, characterData: true, subtree: true});
  // Vanuit de opdrachtenlijst op het label Ondertitels geklikt: meteen naar die tab.
  if (new URLSearchParams(location.search).get("tab") === "subtitles" && layer.subtitles) setMode("subtitles");
}
start();
