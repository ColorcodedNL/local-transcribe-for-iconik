<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refine</title>
<style>
:root {
  --window: #f5f6f7; --surface: #ffffff; --line: #d9dde2; --soft: #eceef1; --head: #fafbfc;
  --text: #1c1f23; --muted: #6a727d; --accent: #1a6fe0; --pick: #eaf2fd;
  --wave: #8f98a3; --wave-off: #c9ced5; --play: #c9412b; --bad: #c9412b; --video: #0d0f12;
}
@media (prefers-color-scheme: dark) {
  :root {
    --window: #1d2025; --surface: #262a30; --line: #343941; --soft: #2e333a; --head: #2a2e35;
    --text: #e8eaed; --muted: #8d95a0; --accent: #4c9dff; --pick: #1f3350;
    --wave: #7d8692; --wave-off: #464c56; --play: #e5634d; --bad: #e5634d; --video: #000;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--window); color: var(--text); display: flex; flex-direction: column; overflow: hidden;
       font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
       font-variant-numeric: tabular-nums; -webkit-user-select: none; user-select: none; cursor: default; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: ui-monospace, Menlo, monospace; }
header { display: flex; align-items: center; gap: 12px; padding: 12px 18px 10px; }
header a { color: var(--accent); text-decoration: none; white-space: nowrap; }
header h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -.015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tag { font-size: 11px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; white-space: nowrap; }
.dim { color: var(--muted); white-space: nowrap; }
.grow { flex: 1; }
#upper { flex: 1; min-height: 0; display: flex; gap: 14px; padding: 0 18px; }
#left { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
#screen { position: relative; flex: 1; min-height: 120px; background: var(--video); border-radius: 8px; overflow: hidden; }
#screen video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
#sub { position: absolute; left: 50%; transform: translateX(-50%); bottom: 22px; max-width: 82%; background: rgba(0,0,0,.72);
       color: #fff; font-size: 18px; line-height: 1.35; padding: 4px 12px; border-radius: 4px; text-align: center; pointer-events: none; }
#src { position: absolute; top: 10px; left: 12px; color: #c4c9d0; font-size: 11px; background: rgba(0,0,0,.55); padding: 2px 7px; border-radius: 4px; }
#busy { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #8d95a0; font-size: 12px; }
.bar { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.icon { width: 32px; height: 32px; border: 0; background: none; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
.icon:hover { background: var(--soft); }
#play { width: 36px; height: 36px; background: var(--accent); color: #fff; border-radius: 50%; }
#play:hover { filter: brightness(1.08); }
#right { width: 440px; flex: none; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
#speakers { padding: 8px 10px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: var(--head); }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; background: var(--surface); }
.sw { width: 10px; height: 10px; border-radius: 2px; flex: none; display: inline-block; }
#count { padding: 6px 10px; border-bottom: 1px solid var(--line); color: var(--muted); display: flex; gap: 10px; }
#list { flex: 1; overflow-y: auto; }
.blk { display: grid; grid-template-columns: 30px 1fr; gap: 1px 8px; padding: 7px 10px 8px; border-bottom: 1px solid var(--soft); box-shadow: inset 3px 0 0 transparent; }
.blk.pick { background: var(--pick); box-shadow: inset 3px 0 0 var(--accent); }
.blk.now .txt { font-weight: 550; }
.blk .nr { color: var(--muted); font-size: 11px; padding-top: 1px; }
.blk .meta { display: flex; gap: 8px; align-items: baseline; font-size: 11px; color: var(--muted); min-width: 0; }
.blk .who { display: inline-flex; align-items: center; gap: 4px; color: var(--text); }
.blk .txt { grid-column: 2; font-size: 13.5px; line-height: 1.4; -webkit-user-select: text; user-select: text; }
.low { text-decoration: underline wavy color-mix(in srgb, var(--bad) 70%, transparent); text-underline-offset: 3px; }
#lower { flex: none; margin: 12px 18px 0; background: var(--surface); border: 1px solid var(--line); border-bottom: 0; border-radius: 8px 8px 0 0; display: flex; flex-direction: column; }
#tools { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-bottom: 1px solid var(--line); }
#tools input[type=range] { width: 140px; }
#tl { display: grid; grid-template-columns: 210px 1fr; }
#labels { border-right: 1px solid var(--line); font-size: 11px; color: var(--muted); }
#labels > div { border-bottom: 1px solid var(--soft); padding: 0 6px 0 10px; display: flex; align-items: center; gap: 8px; }
.lane-name { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.lane-name b { color: var(--text); font-weight: 600; white-space: nowrap; }
.lane-name span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lane-name span.used { color: var(--good, #2e9a48); }
.listen { width: 26px; height: 26px; flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 5px; display: flex; align-items: center; justify-content: center; }
.listen[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
#canvasBox { position: relative; overflow: hidden; }
#canvas { display: block; width: 100%; cursor: text; }
footer { display: flex; gap: 18px; align-items: center; padding: 6px 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
#error { margin: 0 18px 10px; background: color-mix(in srgb, var(--bad) 14%, transparent); border-left: 3px solid var(--bad); padding: 8px 10px; border-radius: 4px; -webkit-user-select: text; user-select: text; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <a href="/" id="back"></a>
  <h1 id="title"></h1>
  <span class="tag">Refine</span>
  <span class="dim" id="mode"></span>
  <span class="grow"></span>
</header>
<div id="error" hidden></div>
<div id="upper">
  <section id="left">
    <div id="screen">
      <video id="video" playsinline></video>
      <div id="busy"></div>
      <div id="src" hidden></div>
      <div id="sub" hidden></div>
    </div>
    <div class="bar">
      <button class="icon" id="prev" aria-label=""><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 3v10M13 3 6 8l7 5z"/></svg></button>
      <button class="icon" id="play" aria-label=""><svg id="playIcon" width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 2.5v11l9.5-5.5z"/></svg></button>
      <button class="icon" id="next" aria-label=""><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 3v10M3 3l7 5-7 5z"/></svg></button>
      <span class="mono" id="tc" style="margin-left: 6px">00:00:00:00</span>
      <span class="dim mono" id="total"></span>
      <span class="grow"></span>
      <span class="dim" id="keys"></span>
    </div>
  </section>
  <section id="right">
    <div id="speakers"></div>
    <div id="count"></div>
    <div id="list"></div>
  </section>
</div>
<section id="lower">
  <div id="tools">
    <span class="dim" id="hearLabel"></span><span id="hear"></span>
    <span class="grow"></span>
    <span class="dim" id="wavesState"></span>
    <span class="dim" id="zoomLabel"></span>
    <input type="range" id="zoom" min="0" max="1000" value="600">
  </div>
  <div id="tl">
    <div id="labels"></div>
    <div id="canvasBox"><canvas id="canvas"></canvas></div>
  </div>
  <footer><span id="source"></span><span class="grow"></span><span id="note"></span></footer>
</section>
<script>
const TEXT = {
  nl: {
    back: "‹ Opdrachten", mode: "Alleen bekijken: bewerken komt in de volgende stap", prev: "Vorig blok", next: "Volgend blok",
    play: "Afspelen", pause: "Pauze", keys: "spatie · ← → · ⌥ ← →", blocks: n => `${n} blokken`, words: n => `${n} woorden`,
    hear: "Je hoort:", mix: list => `mix van de gebruikte sporen (${list})`, solo: n => `alleen spoor ${n}`, zoom: "Zoom",
    text: "Tekst", speakerLane: "Sprekers", track: n => `Spoor ${n}`, used: "gebruikt", skipped: "overgeslagen",
    listen: "Luister alleen naar dit spoor", loading: "Laden...", video: "Beeld laden...", noVideo: "Geen beeld: alleen geluid",
    waves: f => `Golfvormen uitrekenen ${Math.round(f * 100)}%`, wavesFail: "Golfvormen niet beschikbaar",
    from: { mac: "kopie op deze Mac", iconik: "uit Iconik" }, source: (e, o) => `Bron: ${e}, ${o}`,
    note: "Niets wordt opgeslagen: dit is alleen bekijken.", origin: name => `Origineel via opslag (ISG) · ${name}`,
    notes: {},
  },
  en: {
    back: "‹ Jobs", mode: "View only: editing comes in the next step", prev: "Previous block", next: "Next block",
    play: "Play", pause: "Pause", keys: "space · ← → · ⌥ ← →", blocks: n => `${n} blocks`, words: n => `${n} words`,
    hear: "You hear:", mix: list => `mix of the used tracks (${list})`, solo: n => `track ${n} only`, zoom: "Zoom",
    text: "Text", speakerLane: "Speakers", track: n => `Track ${n}`, used: "used", skipped: "skipped",
    listen: "Listen to this track only", loading: "Loading...", video: "Loading picture...", noVideo: "No picture: audio only",
    waves: f => `Calculating waveforms ${Math.round(f * 100)}%`, wavesFail: "Waveforms not available",
    from: { mac: "copy on this Mac", iconik: "from Iconik" }, source: (e, o) => `Source: ${e}, ${o}`,
    note: "Nothing is saved: this is view only.", origin: name => `Original via storage (ISG) · ${name}`,
    notes: {"geluid": "audio", "stil": "silent", "tijdcode of toon": "timecode or tone", "eigen microfoon": "dedicated microphone", "gekozen spoor": "chosen track"},
  },
};
const COLORS = ["#1a6fe0", "#f0a54a", "#2e9a48", "#b05cc8", "#d9534f", "#17a2b8", "#8a6d3b", "#6c757d"];
const DARK_INK = new Set(["#f0a54a"]);
const $ = id => document.getElementById(id);
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const ASSET = new URLSearchParams(location.search).get("asset") || "";
let T = TEXT.en, lang = "en", D = null, blocks = [], speakerOf = {}, fps = 25, dur = 0;

// --- tijd ---
const pad = n => String(n).padStart(2, "0");
function tc(s) {
  const f = Math.max(0, Math.round(s * fps)), r = Math.round(fps), fr = f % r, t = Math.floor(f / r);
  return pad(Math.floor(t / 3600)) + ":" + pad(Math.floor(t / 60) % 60) + ":" + pad(t % 60) + ":" + pad(fr);
}
const secs = s => (lang === "nl" ? s.toFixed(1).replace(".", ",") : s.toFixed(1)) + " s";
function note(text) {
  if (lang === "nl" || !text) return text;
  const same = /^zelfde signaal als spoor (\d+)$/.exec(text);
  return same ? `same signal as track ${same[1]}` : T.notes[text] || text;
}

// --- speler: stukjes van het origineel via Media Source Extensions (zie tools/video_window_probe.py) ---
const v = $("video");
const TYPE = 'video/mp4; codecs="mp4v.20.9, mp4a.40.2"', AUDIO_TYPE = 'audio/mp4; codecs="mp4a.40.2"';
let ms, sb, gen = 0, target = null, next = 0, running = false, solo = 0, wantPlay = false;
let pending = null;   // waar de speler naartoe onderweg is zolang dat stukje nog laadt
const now = () => Math.min(pending ?? (v.currentTime || 0), dur);   // nooit voorbij het eind (laatste stukje is iets langer)
function waitIdle() { return sb.updating ? new Promise(r => sb.addEventListener("updateend", r, {once: true})) : Promise.resolve(); }
function buffered(t) {
  if (!sb) return false;
  const b = sb.buffered;
  for (let i = 0; i < b.length; i++) if (t >= b.start(i) && t < b.end(i) - 0.15) return true;
  return false;
}
function seek(t) {
  t = Math.max(0, Math.min(t, Math.max(dur - 1 / fps, 0)));
  if (buffered(t)) { pending = null; v.currentTime = t; draw(); return; }
  pending = t; target = t; gen++; kick();
}
async function kick() {
  if (running) return; running = true;
  try { await loop(); } catch (e) { console.log("speler: " + e); }
  finally { running = false; }
  if (target !== null) kick();
}
async function loadChunk(my) {
  const r = await fetch(`/refine/chunk?asset=${encodeURIComponent(ASSET)}&t=${next.toFixed(3)}&d=${D.chunk}&solo=${solo}`);
  const buf = await r.arrayBuffer();
  if (my !== gen) return false;
  if (!(r.headers.get("Content-Type") || "").startsWith("video/mp4")) {
    let msg = ""; try { msg = JSON.parse(new TextDecoder().decode(buf)).error; } catch {}
    showError(msg || "ffmpeg"); target = null; return false;
  }
  await waitIdle();
  // Achter de afspeelkop ruimen, anders loopt de buffer bij een lang bestand vol.
  if (sb.buffered.length && v.currentTime - sb.buffered.start(0) > 90) { sb.remove(0, v.currentTime - 30); await waitIdle(); }
  // Elk stukje op zijn eigen plek: het begint intern op 0 en is door AAC iets langer dan gevraagd. Achter
  // elkaar plakken (sequence) liep daardoor per stukje 23 ms uit; zo overschrijft het volgende de staart.
  sb.timestampOffset = next;
  sb.appendBuffer(buf); await waitIdle();
  next += D.chunk; return true;
}
async function loop() {
  while (sb && ms.readyState === "open") {
    if (target !== null) {
      const t = target, my = gen; target = null;
      await waitIdle();
      if (sb.buffered.length) { sb.remove(0, dur + 1); await waitIdle(); }
      next = t;
      if (!await loadChunk(my) || my !== gen) continue;
      v.currentTime = t; pending = null; $("busy").textContent = "";
      if (wantPlay) v.play().catch(() => {});
      draw();
      continue;
    }
    const b = sb.buffered, end = b.length ? b.end(b.length - 1) : next;
    if (next >= dur || end - v.currentTime > 14) return;
    await loadChunk(gen);
  }
}
function startPlayer(t) {
  gen++; target = null; sb = null;
  ms = new MediaSource(); v.src = URL.createObjectURL(ms);
  ms.addEventListener("sourceopen", () => {
    const type = D.video ? TYPE : AUDIO_TYPE;
    if (!MediaSource.isTypeSupported(type)) { showError("WebKit: " + type); return; }
    ms.duration = dur;   // anders zet WebKit de afspeelpositie terug op 0
    sb = ms.addSourceBuffer(type); sb.mode = "segments"; seek(t);
  }, {once: true});
}
v.addEventListener("timeupdate", () => { if (v.currentTime >= dur && !v.paused) v.pause(); kick(); });
v.addEventListener("play", () => { wantPlay = true; playIcon(); });
v.addEventListener("pause", () => { if (pending === null) wantPlay = false; playIcon(); });
function toggle() {
  if (!v.paused) { wantPlay = false; v.pause(); return; }
  wantPlay = true; playIcon();
  if (pending !== null) return;               // de sprong die nog laadt, speelt daarna vanzelf af
  if (buffered(v.currentTime)) v.play().catch(() => {}); else seek(v.currentTime);
}
function playIcon() {
  const paused = v.paused && !wantPlay;
  $("playIcon").innerHTML = paused ? '<path d="M4 2.5v11l9.5-5.5z"/>' : '<path d="M4 2.5h3v11H4zM9 2.5h3v11H9z"/>';
  $("play").setAttribute("aria-label", paused ? T.play : T.pause);
}

// --- blokken en lijst ---
let picked = -1, nowAt = -1;
function blockAt(t) {
  let lo = 0, hi = blocks.length - 1, hit = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (blocks[m].start <= t) { hit = m; lo = m + 1; } else hi = m - 1; }
  return hit >= 0 && t <= blocks[hit].end ? hit : -1;
}
function renderList() {
  const html = blocks.map((b, i) => {
    const sp = speakerOf[b.speaker] || {name: b.speaker, color: COLORS[0]};
    const words = b.text ? esc(b.text) : b.words.map(w => w.score < 0.5 ? `<span class="low">${esc(w.text)}</span>` : esc(w.text)).join(" ");
    return `<div class="blk" id="b${i}" data-i="${i}"><span class="nr">${i + 1}</span><span class="meta"><span class="mono">${tc(b.start)} → ${tc(b.end)}</span><span>${secs(b.end - b.start)}</span><span class="who"><i class="sw" style="background:${sp.color}"></i>${esc(sp.name)}</span></span><span class="txt">${words}</span></div>`;
  }).join("");
  $("list").innerHTML = html;
}
function mark(cls, i, old) {
  if (old >= 0) $("b" + old)?.classList.remove(cls);
  if (i >= 0) $("b" + i)?.classList.add(cls);
}
function pick(i, jump) {
  mark("pick", i, picked); picked = i;
  if (i >= 0 && jump) seek(blocks[i].start);
  if (i >= 0) $("b" + i)?.scrollIntoView({block: "nearest"});
  draw();
}
$("list").addEventListener("click", e => {
  if (window.getSelection().toString()) return;   // tekst selecteren mag zonder te springen
  const el = e.target.closest(".blk"); if (el) pick(+el.dataset.i, true);
});

// --- tijdlijn op één canvas ---
const cv = $("canvas"), ctx = cv.getContext("2d");
const RULER = 20, TEXT_H = 46, SPK = 14, TRACK = 36;
let viewStart = 0, span = 60, peaks = {}, waveRate = 50, follow = true, css = {};
function laneTops() {
  const tops = {ruler: 0, text: RULER, spk: RULER + TEXT_H, tracks: RULER + TEXT_H + SPK};
  tops.height = tops.tracks + TRACK * D.tracks.length;
  return tops;
}
function readColors() {
  const st = getComputedStyle(document.documentElement);
  ["--line", "--soft", "--head", "--text", "--muted", "--wave", "--wave-off", "--play", "--accent", "--surface", "--pick"].forEach(k => css[k] = st.getPropertyValue(k).trim());
}
function sizeCanvas() {
  const tops = laneTops(), w = $("canvasBox").clientWidth, dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(1, Math.round(w * dpr)); cv.height = Math.round(tops.height * dpr);
  cv.style.height = tops.height + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}
function setZoom() {
  // Schuif 0..1000 logaritmisch van het hele bestand tot 8 seconden in beeld.
  const z = +$("zoom").value / 1000, full = Math.max(dur * 1.04, 8);   // iets ruimte voorbij het einde
  span = Math.exp(Math.log(full) + (Math.log(8) - Math.log(full)) * z);
  clampView(); draw();
}
// Tot net voorbij het einde schuiven, zodat de afspeelkop aan het eind in beeld blijft.
function clampView() { viewStart = Math.max(0, Math.min(viewStart, Math.max(dur + span * 0.04 - span, 0))); }
const xOf = (t, w) => (t - viewStart) / span * w;
function niceStep(w) {
  const want = span / Math.max(w / 90, 1);
  for (const s of [0.5, 1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600]) if (s >= want) return s;
  return 7200;
}
function draw() {
  if (!D) return;
  const w = $("canvasBox").clientWidth, tops = laneTops(), t = now();
  ctx.clearRect(0, 0, w, tops.height);
  // lijnen tussen de lanes
  ctx.fillStyle = css["--head"]; ctx.fillRect(0, 0, w, RULER);
  ctx.fillStyle = css["--soft"];
  [RULER, tops.spk, tops.tracks].concat(D.tracks.map((_, i) => tops.tracks + TRACK * (i + 1))).forEach(y => ctx.fillRect(0, y - 1, w, 1));
  // liniaal
  const step = niceStep(w);
  ctx.font = "10px ui-monospace, Menlo, monospace"; ctx.textBaseline = "middle";
  for (let s = Math.floor(viewStart / step) * step; s < viewStart + span; s += step) {
    const x = Math.round(xOf(s, w)) + 0.5;
    ctx.fillStyle = css["--line"]; ctx.fillRect(x, 0, 1, RULER);
    ctx.fillStyle = css["--muted"]; ctx.fillText(tc(s).slice(step < 1 ? 3 : 0, step < 1 ? 11 : 8), x + 4, RULER / 2);
  }
  // blokken
  const first = Math.max(0, blockAt(viewStart) >= 0 ? blockAt(viewStart) : blocks.findIndex(b => b.end >= viewStart));
  ctx.font = "11px -apple-system, BlinkMacSystemFont, sans-serif";
  for (let i = first; i >= 0 && i < blocks.length; i++) {
    const b = blocks[i]; if (b.start > viewStart + span) break;
    const x0 = xOf(b.start, w), x1 = xOf(b.end, w), bw = Math.max(x1 - x0, 2);
    const sp = speakerOf[b.speaker] || {color: COLORS[0]};
    ctx.fillStyle = sp.color;
    roundRect(x0, tops.text + 6, bw, TEXT_H - 12, 4); ctx.fill();
    if (i === picked) { ctx.strokeStyle = css["--text"]; ctx.lineWidth = 2; roundRect(x0 - 2, tops.text + 4, bw + 4, TEXT_H - 8, 5); ctx.stroke(); }
    if (bw > 40) {
      ctx.save(); ctx.beginPath(); ctx.rect(x0 + 6, tops.text + 6, bw - 12, TEXT_H - 12); ctx.clip();
      ctx.fillStyle = DARK_INK.has(sp.color) ? "#1c1f23" : "#ffffff"; ctx.textBaseline = "top";
      wrap(b.display, x0 + 6, tops.text + 10, bw - 12, 13, 2);
      ctx.restore();
    }
    ctx.globalAlpha = 0.6; ctx.fillStyle = sp.color; ctx.fillRect(x0, tops.spk + 3, bw, SPK - 6); ctx.globalAlpha = 1;
  }
  // golfvormen
  D.tracks.forEach((tr, k) => {
    const y = tops.tracks + TRACK * k, mid = y + TRACK / 2, data = peaks[tr.n];
    if (!data || !data.length) return;
    ctx.fillStyle = tr.used ? css["--wave"] : css["--wave-off"];
    if (solo === tr.n) ctx.fillStyle = css["--accent"];
    for (let x = 0; x < w; x++) {
      const a = Math.floor((viewStart + x / w * span) * waveRate), z = Math.max(a + 1, Math.floor((viewStart + (x + 1) / w * span) * waveRate));
      let m = 0; for (let j = Math.max(a, 0); j < Math.min(z, data.length); j++) if (data[j] > m) m = data[j];
      const h = Math.max(1, m / 255 * (TRACK - 8));
      ctx.fillRect(x, mid - h / 2, 1, h);
    }
  });
  // na het einde van het bestand
  const xEnd = xOf(dur, w);
  if (xEnd < w) { ctx.fillStyle = css["--soft"]; ctx.fillRect(Math.max(xEnd, 0), RULER, w - Math.max(xEnd, 0), tops.height - RULER); }
  // afspeelkop
  if (t >= viewStart && t <= viewStart + span) {
    const x = Math.round(xOf(t, w));
    ctx.fillStyle = css["--play"]; ctx.fillRect(x - 1, 0, 2, tops.height);
    ctx.beginPath(); ctx.moveTo(x - 5, 0); ctx.lineTo(x + 5, 0); ctx.lineTo(x, 8); ctx.fill();
  }
}
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function wrap(text, x, y, maxW, lineH, maxLines) {
  const words = text.split(" "); let line = "", n = 0;
  for (const word of words) {
    const test = line ? line + " " + word : word;
    if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, x, y + n * lineH); n++; line = word; if (n >= maxLines) return; }
    else line = test;
  }
  if (line && n < maxLines) ctx.fillText(line, x, y + n * lineH);
}
cv.addEventListener("click", e => {
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, tops = laneTops();
  const t = viewStart + x / r.width * span;
  if (y >= tops.text && y < tops.spk) { const i = blockAt(t); if (i >= 0) { pick(i, false); } }
  follow = true; seek(t);
});
$("canvasBox").addEventListener("wheel", e => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) {   // knijpen of cmd+scroll: zoomen rond de muis
    const r = cv.getBoundingClientRect(), at = viewStart + (e.clientX - r.left) / r.width * span;
    $("zoom").value = Math.max(0, Math.min(1000, +$("zoom").value - e.deltaY * 2));
    setZoom(); viewStart = at - (e.clientX - r.left) / r.width * span; clampView(); draw(); return;
  }
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  viewStart += d / cv.clientWidth * span; clampView(); follow = false; draw();
}, {passive: false});
$("zoom").addEventListener("input", () => { const mid = viewStart + span / 2; setZoom(); viewStart = mid - span / 2; clampView(); draw(); });

// --- elke frame: afspeelkop, huidig blok, ondertitel ---
function frame() {
  if (D) {
    const t = now();
    $("tc").textContent = tc(t);
    if (follow && !v.paused && (t < viewStart || t > viewStart + span * 0.85)) { viewStart = t - span * 0.1; clampView(); }
    if (follow && v.paused && pending === null && t > viewStart + span) { viewStart = t - span * 0.9; clampView(); }
    const i = blockAt(t);
    if (i !== nowAt) {
      mark("now", i, nowAt); nowAt = i;
      if (i >= 0 && !v.paused) $("b" + i)?.scrollIntoView({block: "nearest"});
      const sub = $("sub"); sub.hidden = i < 0; if (i >= 0) sub.textContent = blocks[i].display;
    }
    if (!v.paused || running) draw();
  }
  requestAnimationFrame(frame);
}

// --- sporen ---
function renderLabels() {
  const tops = laneTops();
  let html = `<div style="height:${RULER}px"></div><div style="height:${TEXT_H}px;color:var(--text);font-weight:600">${T.text}</div><div style="height:${SPK}px">${T.speakerLane}</div>`;
  html += D.tracks.map(tr => {
    const state = (tr.label ? note(tr.label) + " · " : "") + (tr.used ? T.used : T.skipped);
    return `<div style="height:${TRACK}px"><button class="listen" data-n="${tr.n}" aria-pressed="${solo === tr.n}" title="${T.listen}" aria-label="${T.listen}: ${T.track(tr.n)}"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2.5 10V8a5.5 5.5 0 0 1 11 0v2"/><rect x="2" y="9.5" width="3" height="4.5" rx="1"/><rect x="11" y="9.5" width="3" height="4.5" rx="1"/></svg></button><span class="lane-name"><b>${T.track(tr.n)}</b><span class="${tr.used ? "used" : ""}">${esc(state)}</span></span></div>`;
  }).join("");
  $("labels").innerHTML = html;
  const used = D.tracks.filter(t => t.used).map(t => t.n).join(" + ");
  $("hear").textContent = solo ? T.solo(solo) : T.mix(used);
}
$("labels").addEventListener("click", e => {
  const b = e.target.closest(".listen"); if (!b) return;
  const n = +b.dataset.n; solo = solo === n ? 0 : n;
  renderLabels(); startPlayer(now()); draw();
});
async function loadWaves() {
  for (;;) {
    let r;
    try { r = await fetch(`/refine/waves?asset=${encodeURIComponent(ASSET)}`); } catch { $("wavesState").textContent = T.wavesFail; return; }
    if ((r.headers.get("Content-Type") || "").startsWith("application/json")) {
      const j = await r.json();
      if (j.error) { $("wavesState").textContent = T.wavesFail; console.log(j.error); return; }
      $("wavesState").textContent = T.waves(j.fraction || 0);
      await new Promise(res => setTimeout(res, 800)); continue;
    }
    const raw = new Uint8Array(await r.arrayBuffer()), nl = raw.indexOf(10);
    const head = JSON.parse(new TextDecoder().decode(raw.subarray(0, nl)));
    let at = nl + 1; waveRate = head.rate;
    head.tracks.forEach(tr => { peaks[tr.n] = raw.subarray(at, at + tr.length); at += tr.length; });
    $("wavesState").textContent = ""; draw(); return;
  }
}

// --- toetsen ---
document.addEventListener("keydown", e => {
  if (e.target.closest("input:not([type=range]), textarea, [contenteditable]")) return;
  const t = now();
  if (e.code === "Space") { e.preventDefault(); toggle(); }
  else if (e.key === "ArrowLeft" && e.altKey) { e.preventDefault(); stepBlock(-1); }
  else if (e.key === "ArrowRight" && e.altKey) { e.preventDefault(); stepBlock(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); follow = true; seek(t - (e.shiftKey ? 5 : 1)); }
  else if (e.key === "ArrowRight") { e.preventDefault(); follow = true; seek(t + (e.shiftKey ? 5 : 1)); }
  else if (e.key === "k" || e.key === "K") { wantPlay = false; v.pause(); playIcon(); }
  else if (e.key === "l" || e.key === "L") { if (v.paused) toggle(); }
  else if (e.key === "j" || e.key === "J") { follow = true; seek(t - 5); }
});
function stepBlock(dir) {
  const t = now();
  let i = dir > 0 ? blocks.findIndex(b => b.start > t + 0.05) : -1;
  if (dir < 0) { for (let k = blocks.length - 1; k >= 0; k--) if (blocks[k].start < t - 0.3) { i = k; break; } }
  if (i >= 0) { follow = true; pick(i, true); }
}
$("prev").onclick = () => stepBlock(-1);
$("next").onclick = () => stepBlock(1);
$("play").onclick = toggle;

function showError(text) { $("error").textContent = text; $("error").hidden = false; $("busy").textContent = ""; }

// --- start ---
async function start() {
  try { D = await (await fetch(`/refine/view?asset=${encodeURIComponent(ASSET)}`)).json(); }
  catch (e) { showError(String(e)); return; }
  lang = D.lang === "nl" ? "nl" : "en"; T = TEXT[lang]; document.documentElement.lang = lang;
  $("back").textContent = T.back; $("mode").textContent = T.mode; $("keys").textContent = T.keys;
  $("prev").setAttribute("aria-label", T.prev); $("next").setAttribute("aria-label", T.next);
  $("hearLabel").textContent = T.hear; $("zoomLabel").textContent = T.zoom; $("note").textContent = T.note;
  if (D.error) { $("title").textContent = ASSET; showError(D.error); return; }
  document.title = D.title + " · Refine"; $("title").textContent = D.title;
  fps = D.fps || 25; dur = D.duration || 0;
  const tr = D.transcript;
  tr.speakers.forEach((s, i) => speakerOf[s.id] = {name: s.name, color: COLORS[i % COLORS.length]});
  blocks = tr.segments.map(s => ({start: s.start / 1000, end: s.end / 1000, speaker: s.speaker, text: s.text || "",
    words: (s.words || []).map(w => ({text: w[0], start: w[1] / 1000, end: w[2] / 1000, score: w[3]}))}));
  blocks.forEach(b => b.display = b.text || b.words.map(w => w.text).join(" "));
  $("speakers").innerHTML = tr.speakers.map(s => `<span class="chip"><i class="sw" style="background:${speakerOf[s.id].color}"></i>${esc(s.name)}</span>`).join("");
  const wordCount = blocks.reduce((n, b) => n + b.words.length, 0);
  $("count").innerHTML = `<span>${T.blocks(blocks.length)}</span><span>${T.words(wordCount)}</span>`;
  $("total").textContent = "/ " + tc(dur);
  const engine = [tr.engine.model, tr.engine.version ? "mlx-whisper " + tr.engine.version : ""].filter(Boolean).join(", ") || "Local Transcribe";
  $("source").textContent = T.source(engine, T.from[D.origin] || D.origin);
  $("src").textContent = T.origin(D.media_name); $("src").hidden = false;
  $("busy").textContent = D.video ? T.video : T.noVideo;
  renderList(); renderLabels(); readColors(); playIcon();
  $("zoom").value = 600; setZoom(); sizeCanvas();
  new ResizeObserver(sizeCanvas).observe($("canvasBox"));
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readColors(); draw(); });
  startPlayer(blocks.length ? blocks[0].start : 0);
  loadWaves();
  requestAnimationFrame(frame);
}
start();
</script>
