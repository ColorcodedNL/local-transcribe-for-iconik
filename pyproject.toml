[project]
name = "iconik-transcribe"
version = "0.7.0"
description = "Local transcription for Iconik on Apple Silicon (Whisper large-v3 via MLX, pyannote)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "keyring>=25.7.0",
    "mlx-whisper>=0.4.3",
    "pyannote-audio>=4.0.7",
    "pynacl>=1.6.2",
    "pywebview>=6.2.1",
    "requests>=2.34.2",
]

[tool.ruff]
# Alleen de fouten van pyflakes: ontbrekende of dubbele namen, ongebruikte imports. Geen stijlregels.
# scripts/run_tests.sh draait dit voor de tests (ook in GitHub Actions) met een vaste versie.
lint.select = ["F"]
extend-exclude = ["build", "dist"]

