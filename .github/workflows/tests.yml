# Alle tests bij elke push en pull request, ook de browsertest van het venster.
# De app zelf draait alleen op een Mac; de tests vervangen MLX, torch en de sleutelhanger, dus Linux volstaat.
# De browsertest gebruikt de Google Chrome die al op de runner staat. ffmpeg komt uit apt: test_refine maakt er
# een testbestand mee, en test_audio_memory slaat zonder ffmpeg de helft over.
name: tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: ffmpeg
        # Eerst een kant-en-klare LGPL-build van GitHub (BtbN/FFmpeg-Builds): komt binnen seconden binnen en is
        # LGPL zoals de ffmpeg in de app. Apt is de reserve: de Ubuntu-spiegel van de runners leverde in november
        # 100 tot 300 KB/s, te traag voor 173 MB aan pakketten. Alleen voor de tests; de app bouwt zijn eigen ffmpeg.
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          NAME=ffmpeg-master-latest-linux64-lgpl
          BASE=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest
          cd "$RUNNER_TEMP"
          if curl -fsSL --retry 3 --max-time 180 -o "$NAME.tar.xz" "$BASE/$NAME.tar.xz" \
             && curl -fsSL --retry 3 --max-time 30 -o checksums.sha256 "$BASE/checksums.sha256" \
             && grep -E "[ *]$NAME\.tar\.xz\$" checksums.sha256 | sed 's/\*//' | sha256sum -c - \
             && tar -xf "$NAME.tar.xz"; then
            echo "$RUNNER_TEMP/$NAME/bin" >> "$GITHUB_PATH"
            export PATH="$RUNNER_TEMP/$NAME/bin:$PATH"
          else
            echo "Kant-en-klare ffmpeg lukte niet, nu via apt"
            APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dpkg::Use-Pty=0"
            sudo -E timeout 120 apt-get $APT update -q && sudo -E timeout 480 apt-get $APT install -y -q --no-install-recommends ffmpeg || true
          fi
          command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || { echo "ffmpeg of ffprobe ontbreekt"; exit 1; }
          ffmpeg -version | head -1
      - name: uv
        run: pipx install uv
      - name: Tests
        env:
          LT_CHROMIUM: /usr/bin/google-chrome
        run: bash scripts/run_tests.sh
